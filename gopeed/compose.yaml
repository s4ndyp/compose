# gopeed — Gopeed (moderne, snelle download manager: HTTP/HTTPS/BitTorrent/Metalink,
# met web-UI en REST-API; Go + embedded Flutter-webclient).
#
# Externe app (geen eigen repo): deze stack staat in s4ndyp/compose. Draait in een
# eigen LXC onder Dockhand; de browser-route is host-poort 80 (homelab-conventie).
#
# Poorten: 80 → 9999 (web-UI op /, REST-API op /api/, MCP op /mcp).
# Volumes: gopeed_storage = taakdatabase (BoltDB) + extensies (named volume; staat in de
#   rootfs van CT179 en gaat mee in de vzdump-backup). De downloads gaan NIET naar een
#   volume maar naar de SMB-share **Downloads** op de UNAS: die is op de PVE-node
#   Proxnux2 gemount (/etc/fstab → //10.1.1.1/Downloads op /mnt/unaz-downloads,
#   credentials in /root/.smb-downloads.cred, uid/gid 100000 voor deze unprivileged
#   container) en als `mp0: /mnt/unaz-downloads,mp=/mnt/gopeed` in de LXC-config gebonden.
#   De compose bindt dat door naar /app/Downloads — een ABSOLUUT host-pad, dus géén
#   relatieve ./bind (die lost op de Dockhand-host op en wordt daar een lege map).
#
# Auth: géén app-wachtwoord. De UI hangt achter de **Pocket ID-gate** op Zoraxy en de
#   host-poort 80 staat op de LXC alleen open voor Zoraxy/Hermes/Dockhand (DOCKER-USER-
#   allowlist, /opt/gopeed-ui-firewall.sh). Wil je tóch app-auth, zet dan
#   GOPEED_USERNAME + GOPEED_PASSWORD (secret via Infisical-map /gopeed) in de stack.
#   Die env-vorm is de v2-manier (`GOPEED_<json-tag>`); de oude `-u/-p`-args werken ook.
#
# Upgraden: image-tag ophogen naar de nieuwste release (GH: GopeedLab/gopeed,
#   Docker Hub: liwei2633/gopeed) → redeploy. De taakdatabase in gopeed_storage
#   migreert bij de start automatisch.
name: gopeed

services:
  gopeed:
    image: liwei2633/gopeed:v2.0.0
    container_name: gopeed
    restart: unless-stopped
    ports:
      # web-UI + REST-API: host 80, intern luistert Gopeed op 9999
      - "${APP_PORT:-80}:9999"
    environment:
      TZ: Europe/Amsterdam
      # De image dropt via su-exec naar PUID:PGID; 0:0 = root, zodat de owner van de
      # named volumes klopt (entrypoint doet chown -R /app).
      PUID: "0"
      PGID: "0"
      UMASK: "022"
      # Downloads alleen binnen de mount toestaan; anders kan een taak overal in de
      # container schrijven.
      GOPEED_WHITEDOWNLOADDIRS: /app/Downloads
      # MCP-endpoint (/mcp) aan: AI-agenten kunnen taken aanmaken/beheren. Zit achter
      # dezelfde Pocket ID-gate en firewall-allowlist als de REST-API.
      GOPEED_MCPENABLE: "true"
    volumes:
      - gopeed_storage:/app/storage
      # SMB-share "Downloads" op de UNAS (via de LXC-mount /mnt/gopeed)
      - /mnt/gopeed:/app/Downloads
    healthcheck:
      # Geen eigen health-endpoint; de statische webclient op / antwoordt altijd 200
      # (ook met web-auth aan, want de loginpagina zelf is publiek).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9999/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gopeed_storage: