# ntfy (extern; self-gehoste push-notificatiebus voor scripts, cronjobs en Home Assistant)
#
# - Browser/UI: http://<lxc-ip>/  (host-poort 80 → container 80; het image EXPOSE't 80).
# - Gebruik: publiceren kan met één curl — `curl -d "backup klaar" http://<lxc-ip>/homelab`.
#   Met auth aan (zie hieronder) gaat dat met een access-token:
#   `curl -H "Authorization: Bearer ***" -d "…" https://ntfy.xdio.nl/homelab`.
# - Config staat INLINE (configs.content): de compose draait op de Dockhand-host en relatieve
#   bestands-binds komen op de app-LXC leeg aan. Let op de valkuil: een inhoudswijziging van een
#   inline config herstart de container NIET — bij een config-wijziging de container geforceerd
#   verwijderen via de docker-API van de LXC en daarna opnieuw deployen.
# - Auth: `auth-default-access: deny-all` + `auth-file` op /var/lib/ntfy/user.db (buiten de
#   read-only config). Gebruikers/tokens maak je aan met de CLI in de container, non-interactief
#   via de env-var NTFY_PASSWORD:
#     docker exec ntfy sh -c 'NTFY_PASSWORD=… ntfy user add --role=admin <naam>'
#     docker exec ntfy sh -c 'ntfy access <naam> "homelab*" write-only'   # schrijf-only bus
#     docker exec ntfy sh -c 'ntfy token add --label homelab-scripts <naam>'  # token voor scripts
#   Wachtwoorden/tokens horen in Infisical-map /ntfy (en Vaultwarden-collectie Home-automation).
# - Géén Pocket-ID-gate op de route: mobiele clients en curl kunnen geen SSO-flow doorlopen.
#   De toegang loopt via ntfy's eigen users/ACL; de UI is LAN-only via AdGuard-rewrite +
#   Zoraxy-route (ntfy.xdio.nl).
# - Géén Firebase/upstream: zonder `firebase-key-file` en `upstream-base-url` is er geen
#   verbinding met ntfy.sh. De Android-app houdt dan zelf een verbinding in stand (F-Droid-versie
#   of 'instant delivery'); er gaat dus geen bericht naar buiten.
# - Upgraden: image-tag hieronder ophogen naar de nieuwste release
#   (gh release list -R binwiederhier/ntfy) en redeployen; cache/attachments/users blijven in de
#   named volumes staan.
name: ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.2
    container_name: ntfy
    command: serve
    restart: unless-stopped
    ports:
      # browser-UI + publicatie-endpoint + web-UI op host-poort 80
      - "${APP_PORT:-80}:80"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      # berichtencache + attachments (regeneratief)
      - ntfy_cache:/var/cache/ntfy
      # auth-database (user.db) — NIET in de read-only config, de CLI schrijft hier
      - ntfy_data:/var/lib/ntfy
    configs:
      - source: ntfy_server_yml
        target: /etc/ntfy/server.yml
    healthcheck:
      # /v1/health is auth-vrij en het image is alpine (busybox-wget aanwezig)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-ntfy
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?tunnel-token ontbreekt in de stack-.env}

configs:
  ntfy_server_yml:
    content: |
      # ntfy-serverconfig (bron van waarheid: dit bestand in de repo)
      base-url: "https://ntfy.xdio.nl"
      listen-http: ":80"
      behind-proxy: true
      web-root: "app"
      # berichten 24 uur bewaren zodat clients na een netwerkstoring kunnen bijladen
      cache-file: "/var/cache/ntfy/cache.db"
      cache-duration: "24h"
      # attachments (logs/screenshots uit scripts); harde rem op het datavolume
      attachment-cache-dir: "/var/cache/ntfy/attachments"
      attachment-total-size-limit: "5G"
      attachment-file-size-limit: "15M"
      attachment-expiry-duration: "48h"
      # auth: alles dicht tenzij expliciet toegekend (users/ACL via de CLI)
      auth-file: "/var/lib/ntfy/user.db"
      auth-default-access: "deny-all"
      enable-signup: false
      enable-login: true
      keepalive-interval: "45s"
      manager-interval: "1m"
      # web push (RFC8030): desktopmeldingen in de browser, ook met de tab dicht.
      # Vereist HTTPS (Zoraxy doet de TLS-terminatie) en de web-app op dezelfde server.
      # De VAPID-sleutels staan NIET in deze publieke repo: ze komen uit de stack-.env
      # (Dockhand `PUT /api/stacks/ntfy/env/raw`) en uit Infisical-map /ntfy.
      # Chrome/Firefox op desktop leveren web push alleen zolang de browser draait; de tab mag dicht.
      web-push-file: "/var/lib/ntfy/webpush.db"
      web-push-public-key: "${NTFY_WEB_PUSH_PUBLIC_KEY:?web-push publieke sleutel ontbreekt in de stack-.env}"
      web-push-private-key: "${NTFY_WEB_PUSH_PRIVATE_KEY:?web-push prive-sleutel ontbreekt in de stack-.env}"
      web-push-email-address: "sandyp@xdio.nl"

volumes:
  ntfy_cache:
  ntfy_data: