# rclone_ui — Rclone UI — rclone-webbeheer (manager + rclone-rc daemon)
#
# Start:  docker compose up -d
services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    command: rcd --rc-addr :5572 --rc-no-auth --rc-allow-origin "*"
    ports:
      - "${RCLONE_RC_PORT:-5572}:5572"
    volumes:
      - rclone_config:/config/rclone
      - rclone_data:/data
      # Host-mounts via rclone mount? Zet een van deze uit en maak shared:
      # - /path/to/host/mounts:/mnt:shared
    # privileged + fuse zijn nodig voor rclone mount binnen docker
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse

  manager:
    image: ghcr.io/s4ndyp/rclone_ui:latest
    container_name: rclone-manager
    restart: unless-stopped
    ports:
      - "${RCLONE_UI_PORT:-8080}:8080"
    environment:
      - RCLONE_RC_URL=http://rclone:5572
      - JOBS_FILE=/data/jobs.json
    volumes:
      - rclone_manager_data:/data
    depends_on:
      - rclone

volumes:
  rclone_config:
  rclone_data:
  rclone_manager_data:
