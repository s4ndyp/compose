# notelight — NoteLight — notities (PocketBase)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  notelight:
    image: ghcr.io/s4ndyp/notelight:latest
    pull_policy: always
    container_name: notelight
    restart: unless-stopped
    ports:
      - "${NOTELIGHT_PORT:-80}:8080"
    volumes:
      - notelight_data:/pb/pb_data

volumes:
  notelight_data:
