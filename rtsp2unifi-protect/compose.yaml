name: rtsp2unifi-protect

# Externe stack (niet-s4ndyp): rtsp2unifi-protect — virtuele ONVIF-camera's die bestaande
# RTSP-streams doorgeven aan UniFi Protect.
#
# WAAROM DEZE STACK HIER STAAT
# De Dahua-camera's in het netwerk van de ouders laten soms hun HTTP/RTSP/ONVIF-service hangen
# (oude firmware); het Dahua-eigen protocol (poort 37777) blijft dan werken. De Dahua NVR
# (192.168.2.251) praat via dat stabiele protocol en HER-SERVEERT elke camera als RTSP. UniFi
# Protect kan bij een third-party camera alleen IP + login opgeven (geen eigen RTSP-pad/kanaal),
# dus deze bridge presenteert elke NVR-stream als een ONVIF-apparaat waar Protect wél mee overweg
# kan. Protect praat dan met de NVR i.p.v. met de happerende camera.
#
# TWEE VIRTUELE CAMERA'S, TWEE IP's: Protect vraagt alleen een IP (geen poort), dus elke virtuele
# camera moet op poort 80 van een EIGEN adres staan. Het LXC heeft daarom twee netwerkinterfaces:
#   eth0 = 10.5.0.163  -> NVR-kanaal 3 = camera 192.168.2.30
#   eth1 = 10.5.0.171  -> NVR-kanaal 2 = camera 192.168.2.11
# (De schema-check staat twee camera's op één host toe zolang de POORTEN verschillen, maar Protect
#  neemt geen poort aan — vandaar twee adressen.)
#
# CREDENTIALS staan NIET in deze config: bij adoptie in Protect vul je het NVR-account in
# (admin + wachtwoord); de bridge forwardt de RTSP/snapshot-verbinding byte-voor-byte door.
#
# NETWERK: host-modus (geen ports-mapping). Dit is GEEN browser-app, dus de host-poort-80-conventie
# geldt hier niet: elke virtuele camera bindt zijn eigen adres op poort 80.

services:
  rtsp2unifi-protect:
    image: ghcr.io/mz738/rtsp2unifi-protect:2.2.2
    container_name: rtsp2unifi-protect
    restart: unless-stopped
    network_mode: host
    # De image draait standaard als non-root (`node`), maar moet poort 80 (<1024) binden.
    # Docker's NET_BIND_SERVICE-capability werkt niet voor een non-root proces (geen ambient
    # caps), dus draaien we als root; de container is een simpele byte-forwarder in een eigen LXC.
    user: "0:0"
    environment:
      LOG_FORMAT: json
    healthcheck:
      # Het image is een kale Node-runtime (npm eruit gesloopt); de node-binary is de check.
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: onvif_yaml
        target: /onvif.yaml

configs:
  onvif_yaml:
    content: |
      onvif:
        # --- NVR-kanaal 3 = camera 192.168.2.30 (Dahua PTZ 2MP) ---
        - name: Camera 192.168.2.30 (NVR kanaal 3)
          uuid: 9b9dcaf2-cf8c-4074-82f7-107d1c54b7ed
          hostname: 10.5.0.163          # eth0 van het LXC
          manufacturer: Dahua
          model: NVR2104-4KS2
          ports:
            server: 80                  # ONVIF SOAP + snapshot (Protect probeert dit op poort 80)
            rtsp: 8554                  # -> target.ports.rtsp
            snapshot: 8580              # -> target.ports.snapshot
          highQuality:
            rtsp: /cam/realmonitor?channel=3&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=3
            width: 1920
            height: 1080
            framerate: 25
            bitrate: 4096
            quality: 4
          lowQuality:
            rtsp: /cam/realmonitor?channel=3&subtype=1
            snapshot: /cgi-bin/snapshot.cgi?channel=3
            width: 704
            height: 576
            framerate: 25
            bitrate: 512
            quality: 1
          target:
            hostname: 192.168.2.251      # de Dahua NVR (stabiel via 37777 -> herserveert kanaal 3)
            ports:
              rtsp: 554
              snapshot: 80

        # --- NVR-kanaal 2 = camera 192.168.2.11 (XM530, ONVIF) ---
        - name: Camera 192.168.2.11 (NVR kanaal 2)
          uuid: 849a2cd6-c8c8-42dd-83c6-4ba98570db67
          hostname: 10.5.0.171          # eth1 van het LXC
          manufacturer: Xiongmai
          model: XM530_R80X20-PQ_8M
          ports:
            server: 80
            rtsp: 8554
            snapshot: 8580
          highQuality:
            rtsp: /cam/realmonitor?channel=2&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=2
            width: 1920
            height: 1080
            framerate: 12
            bitrate: 4096
            quality: 4
          lowQuality:
            rtsp: /cam/realmonitor?channel=2&subtype=1
            snapshot: /cgi-bin/snapshot.cgi?channel=2
            width: 640
            height: 360
            framerate: 13
            bitrate: 512
            quality: 1
          target:
            hostname: 192.168.2.251      # dezelfde NVR; kanaal 2
            ports:
              rtsp: 554
              snapshot: 80
