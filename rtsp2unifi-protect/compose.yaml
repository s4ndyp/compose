name: gp-camera-bridge

# gp-camera-bridge (LXC 163) - virtuele ONVIF-camera's voor UniFi Protect.
#
# WAAROM DEZE STACK HIER STAAT
# UniFi Protect neemt bij een third-party camera alleen ONVIF aan (IP + login, geen eigen
# RTSP-pad). Deze bridge presenteert elke RTSP-stream als een ONVIF-apparaat. De verbinding
# naar de bron is byte-voor-byte: er wordt NIETS getranscodeerd of gebufferd.
#
# DRIE CAMERA'S, DRIE IP's - 2 DIRECT, 1 VIA go2rtc (2026-11-22)
#   eth0 = 10.5.0.163 -> 192.168.2.30  Dahua PTZ      DIRECT (camera verdraagt meerdere sessies)
#   eth1 = 10.5.0.63  -> 192.168.2.11  Xiongmai XM530  [TIJDELIJK UIT, A/B-test op CT173 camtest 22-11-2026]
#   eth2 = 10.5.0.62  -> 192.168.2.28  Dahua 4MP      DIRECT
# (Extra IP's onder de 100: Proxmox kent CT/VM-ID's vanaf 100, dus 63 = 163-100 en 62 = 163-101
#  kunnen nooit met een toekomstige CT botsen.)
#
# WAAROM DE XIONGMAI NIET MEER VIA DE NVR LOOPT
# De Dahua NVR (192.168.2.251) raakt zijn ONVIF-koppeling met deze camera periodiek ~10 minuten
# kwijt: kanaal 2 leverde minutenlang geen bytes meer (max_idle liep op tot 190 s) terwijl de
# RTSP-poort van de camera zelf 200 OK bleef antwoorden en een andere camera op dezelfde NVR
# onafgebroken doorliep. Protect hing daardoor aan een bron die wegviel. Nu haalt go2rtc EEN
# sessie bij de camera en verdeelt die; Protect mag twee sessies openen, de camera ziet er een.
# De NVR blijft kanaal 2 gewoon gebruiken voor opname en PTZ - daar is niets aan veranderd.
#
# CREDENTIALS staan NIET in dit bestand. De twee Dahua's krijgen bij adoptie in Protect het
# EIGEN account van die camera. Voor de Xiongmai leest go2rtc het wachtwoord uit Infisical
# (/camera-relay via de Dockhand secret-provider); ontbreekt het, dan faalt de deploy luid.
#
# NETWERK: host-modus (geen ports-mapping). Dit is GEEN browser-app, dus de host-poort-80-
# conventie geldt hier niet: elke virtuele camera bindt zijn eigen adres op poort 80.

services:
  # Re-publisher: haalt precies EEN RTSP-sessie bij de Xiongmai-camera en verdeelt die
  # intern over alle afnemers (Protect's live- en 24/7-sessie).
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: camera-bridge-go2rtc
    restart: unless-stopped
    network_mode: host
    configs:
      - source: go2rtc_yaml
        target: /config/go2rtc.yaml

  rtsp2unifi-protect:
    image: ghcr.io/mz738/rtsp2unifi-protect:2.2.2
    container_name: rtsp2unifi-protect
    restart: unless-stopped
    network_mode: host
    depends_on:
      - go2rtc
    # De image draait standaard als non-root (`node`), maar moet poort 80 (<1024) binden.
    # Docker's NET_BIND_SERVICE-capability werkt niet voor een non-root proces (geen ambient
    # caps), dus draaien we als root; de container is een simpele byte-forwarder in een eigen LXC.
    user: "0:0"
    environment:
      LOG_FORMAT: json
    healthcheck:
      # Het image is een kale Node-runtime (npm eruit gesloopt); de node-binary is de check.
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: onvif_yaml
        target: /onvif.yaml

configs:
  go2rtc_yaml:
    content: |
      log:
        level: info
      api:
        listen: ":1984"
      rtsp:
        listen: ":8555"

  onvif_yaml:
    content: |
      onvif:
        # --- camera 192.168.2.30 (Dahua PTZ DH-SD22204T-GN, fw 2.640) ---
        - name: Camera 192.168.2.30 (Dahua PTZ)
          uuid: 9b9dcaf2-cf8c-4074-82f7-107d1c54b7ed
          hostname: 10.5.0.163          # eth0 van het LXC
          manufacturer: Dahua
          model: DH-SD22204T-GN
          ports:
            server: 80                  # ONVIF SOAP (Protect probeert dit op poort 80)
            rtsp: 8554                  # -> target.ports.rtsp
            snapshot: 8580              # -> target.ports.snapshot
          highQuality:
            rtsp: /cam/realmonitor?channel=1&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=1
            width: 1920
            height: 1080
            framerate: 25
            bitrate: 2048
            quality: 4

          target:
            hostname: 192.168.2.30       # de camera zelf (niet de NVR)
            ports:
              rtsp: 554
              snapshot: 80

        # --- camera 192.168.2.28 (Dahua IPC-HDBW3449E-AS-NI, 4MP) ---
        - name: Camera 192.168.2.28 (Dahua 4MP)
          uuid: 8dd000a5-3874-4b40-806e-7c629e21d98e
          hostname: 10.5.0.62           # eth2 van het LXC (extra IP < 100)
          manufacturer: Dahua
          model: IPC-HDBW3449E-AS-NI
          # Let op: deze camera stond op H.265. Protect neemt bij third-party camera's alleen
          # H.264 aan, dus op 2026-11-21 zijn main- en substream naar H.264 omgezet (setConfig).
          ports:
            server: 80
            rtsp: 8554
            snapshot: 8580
          highQuality:
            rtsp: /cam/realmonitor?channel=1&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=1
            width: 2688
            height: 1520
            framerate: 25
            bitrate: 1536
            quality: 4

          target:
            hostname: 192.168.2.28       # de camera zelf
            ports:
              rtsp: 554
              snapshot: 80

      # Prometheus-metrics: /metrics op poort 9180. Nuttig om "verbonden maar bevroren" te zien
      # via onvif_server_proxy_max_idle_seconds{direction="to_client"} (upstream-aanrader).
      metrics:
        port: 9180
