name: rtsp2unifi-protect

# Externe stack (niet-s4ndyp): rtsp2unifi-protect — een virtuele ONVIF-camera die een
# bestaande RTSP-stream doorgeeft aan UniFi Protect.
#
# WAAROM DEZE STACK HIER STAAT
# De Dahua-camera op 192.168.2.30 (netwerk ouders) laat periodiek zijn HTTP/RTSP/ONVIF-service
# hangen (oude firmware 2.640 uit 2018); het Dahua-eigen protocol (poort 37777) blijft dan werken.
# De Dahua NVR (192.168.2.251) praat via dat stabiele protocol en HER-SERVEERT de stream als RTSP
# (kanaal 3 = de camera). UniFi Protect in de homelab kan geen eigen RTSP-pad opgeven (alleen IP +
# login), dus deze bridge presenteert de NVR-stream als een ONVIF-apparaat waar Protect wél mee
# overweg kan. Protect praat dan met de NVR i.p.v. met de happerende camera.
#
# CREDENTIALS staan NIET in deze config: bij adoptie in Protect vul je het NVR-account in
# (admin + wachtwoord); de bridge forwardt de RTSP/snapshot-verbinding byte-voor-byte door.
#
# NETWERK: host-modus (geen ports-mapping). De virtuele camera luistert op het LXC-IP
# 10.5.0.163 — vandaar dat hostname hieronder hard op dat adres staat. Dit is GEEN browser-app,
# dus de host-poort-80-conventie geldt hier niet: de ONVIF-server staat op 80 zodat Protect's
# "third-party camera"-onboarding (IP + login, poort optioneel) hem direct vindt.

services:
  rtsp2unifi-protect:
    image: ghcr.io/mz738/rtsp2unifi-protect:2.2.2
    container_name: rtsp2unifi-protect
    restart: unless-stopped
    network_mode: host
    environment:
      LOG_FORMAT: json
    healthcheck:
      # Het image is een kale Node-runtime (npm eruit gesloopt); de node-binary is de check.
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: onvif_yaml
        target: /onvif.yaml

configs:
  onvif_yaml:
    content: |
      onvif:
        - name: Camera ouders (NVR kanaal 3)
          uuid: 9b9dcaf2-cf8c-4074-82f7-107d1c54b7ed
          hostname: 10.5.0.163          # = LXC-IP; adres waarop de virtuele camera luistert
          manufacturer: Dahua
          model: NVR2104-4KS2
          ports:
            server: 80                  # ONVIF SOAP + snapshot (Protect probeert dit op poort 80)
            rtsp: 8554                  # -> target.ports.rtsp
            snapshot: 8580              # -> target.ports.snapshot
          highQuality:
            rtsp: /cam/realmonitor?channel=3&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=3
            width: 1920
            height: 1080
            framerate: 25
            bitrate: 4096
            quality: 4
          lowQuality:
            rtsp: /cam/realmonitor?channel=3&subtype=1
            snapshot: /cgi-bin/snapshot.cgi?channel=3
            width: 704
            height: 576
            framerate: 25
            bitrate: 512
            quality: 1
          target:
            hostname: 192.168.2.251      # de Dahua NVR (stabiel via 37777 -> herserveert kanaal 3)
            ports:
              rtsp: 554
              snapshot: 80
