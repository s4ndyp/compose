name: rtsp2unifi-protect

# Externe stack (niet-s4ndyp): rtsp2unifi-protect — virtuele ONVIF-camera's die bestaande
# RTSP-streams doorgeven aan UniFi Protect.
#
# WAAROM DEZE STACK HIER STAAT
# UniFi Protect neemt bij een third-party camera alleen ONVIF aan (IP + login, geen eigen
# RTSP-pad). Deze bridge presenteert elke RTSP-stream als een ONVIF-apparaat waar Protect wél
# mee overweg kan. De verbinding naar de echte bron is byte-voor-byte: niets wordt getranscodeerd.
#
# DRIE CAMERA'S, DRIE IP's — 2 DIRECT, 1 VIA DE NVR (2026-11-21)
# De twee Dahua's (192.168.2.30 en 192.168.2.28) worden rechtstreeks op RTSP gepulld: die
# serveren meerdere sessies zonder morren, en zo hangt Protect niet aan camera-ONVIF.
# De Xiongmai (192.168.2.11) gaat via de Dahua NVR (kanaal 2): die camera kan maar één
# RTSP-sessie aan en Protect vraagt er twee, dus de NVR moet de enige consumer zijn.
# Zie de toelichting bij die entry.
#
# Protect vraagt alleen een IP (geen poort) → elke virtuele camera staat op poort 80 van een
# EIGEN adres. Drie netwerkinterfaces op het LXC:
#   eth0 = 10.5.0.163  -> camera 192.168.2.30  (Dahua PTZ DH-SD22204T-GN)
#   eth1 = 10.5.0.63   -> camera 192.168.2.11  (Xiongmai XM530)
#   eth2 = 10.5.0.62   -> camera 192.168.2.28  (Dahua IPC-HDBW3449E-AS-NI)
# (Extra IP's onder de 100, want Proxmox kent CT/VM-ID's vanaf 100 — zo kan een toekomstige CT
#  nooit met deze adressen botsen: 63 = 163 − 100, 62 = 163 − 101.)
#
# CREDENTIALS staan NIET in deze config: bij adoptie in Protect vul je per camera het EIGEN
# account van die camera in (niet het NVR-account); de bridge forwardt de RTSP/snapshot-
# verbinding byte-voor-byte door.
#
# NETWERK: host-modus (geen ports-mapping). Dit is GEEN browser-app, dus de host-poort-80-
# conventie geldt hier niet: elke virtuele camera bindt zijn eigen adres op poort 80.

services:
  rtsp2unifi-protect:
    image: ghcr.io/mz738/rtsp2unifi-protect:2.2.2
    container_name: rtsp2unifi-protect
    restart: unless-stopped
    network_mode: host
    # De image draait standaard als non-root (`node`), maar moet poort 80 (<1024) binden.
    # Docker's NET_BIND_SERVICE-capability werkt niet voor een non-root proces (geen ambient
    # caps), dus draaien we als root; de container is een simpele byte-forwarder in een eigen LXC.
    user: "0:0"
    environment:
      LOG_FORMAT: json
    healthcheck:
      # Het image is een kale Node-runtime (npm eruit gesloopt); de node-binary is de check.
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: onvif_yaml
        target: /onvif.yaml

configs:
  onvif_yaml:
    content: |
      onvif:
        # --- camera 192.168.2.30 (Dahua PTZ DH-SD22204T-GN, fw 2.640) ---
        - name: Camera 192.168.2.30 (Dahua PTZ)
          uuid: 9b9dcaf2-cf8c-4074-82f7-107d1c54b7ed
          hostname: 10.5.0.163          # eth0 van het LXC
          manufacturer: Dahua
          model: DH-SD22204T-GN
          ports:
            server: 80                  # ONVIF SOAP (Protect probeert dit op poort 80)
            rtsp: 8554                  # -> target.ports.rtsp
            snapshot: 8580              # -> target.ports.snapshot
          highQuality:
            rtsp: /cam/realmonitor?channel=1&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=1
            width: 1920
            height: 1080
            framerate: 25
            bitrate: 2048
            quality: 4

          target:
            hostname: 192.168.2.30       # de camera zelf (niet de NVR)
            ports:
              rtsp: 554
              snapshot: 80

        # --- camera 192.168.2.11 (Xiongmai XM530) ---
        - name: Camera 192.168.2.11 (Xiongmai, via Dahua NVR)
          uuid: 849a2cd6-c8c8-42dd-83c6-4ba98570db67
          hostname: 10.5.0.63           # eth1 van het LXC (extra IP < 100)
          manufacturer: Xiongmai
          model: XM530_R80X20-PQ_8M
          # LET OP: deze camera kan feitelijk maar ÉÉN RTSP-sessie aan. Protect opent er
          # standaard twee (live + 24/7-opname) en dan laat de camera BEIDE vallen: kort beeld,
          # weg, opnieuw. Daarom loopt deze ene camera via de Dahua NVR (kanaal 2), die het
          # beeld intern verdeelt — de NVR is dan de enige consumer van de camera.
          # Gevolg: in Protect vul je voor DEZE camera het NVR-account in, niet het camera-account.
          # Geen snapshot-poort: de NVR geeft voor kanaal 2 een 401 op snapshot.cgi.
          ports:
            server: 80
            rtsp: 8554
          highQuality:
            rtsp: /cam/realmonitor?channel=2&subtype=0
            width: 1920
            height: 1080
            framerate: 12
            bitrate: 2560
            quality: 4
          target:
            hostname: 192.168.2.251       # de Dahua NVR (kanaal 2), NIET de camera zelf
            ports:
              rtsp: 554

        # --- camera 192.168.2.28 (Dahua IPC-HDBW3449E-AS-NI, 4MP) ---
        - name: Camera 192.168.2.28 (Dahua 4MP)
          uuid: 8dd000a5-3874-4b40-806e-7c629e21d98e
          hostname: 10.5.0.62           # eth2 van het LXC (extra IP < 100)
          manufacturer: Dahua
          model: IPC-HDBW3449E-AS-NI
          # Let op: deze camera stond op H.265. Protect neemt bij third-party camera's alleen
          # H.264 aan, dus op 2026-11-21 zijn main- én substream naar H.264 omgezet (setConfig).
          ports:
            server: 80
            rtsp: 8554
            snapshot: 8580
          highQuality:
            rtsp: /cam/realmonitor?channel=1&subtype=0
            snapshot: /cgi-bin/snapshot.cgi?channel=1
            width: 2688
            height: 1520
            framerate: 25
            bitrate: 1536
            quality: 4

          target:
            hostname: 192.168.2.28       # de camera zelf
            ports:
              rtsp: 554
              snapshot: 80

      # Prometheus-metrics: /metrics op poort 9180. Nuttig om "verbonden maar bevroren" te zien
      # via onvif_server_proxy_max_idle_seconds{direction="to_client"} (upstream-aanrader).
      metrics:
        port: 9180