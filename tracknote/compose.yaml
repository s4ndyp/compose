# tracknote — TrackNote — tracker + notities (PocketBase + UI)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  app:
    image: ghcr.io/s4ndyp/tracknote:latest
    pull_policy: always
    container_name: tracknote
    restart: unless-stopped
    ports:
      - "${TRACKNOTE_PORT:-80}:8090"
    volumes:
      - tracknote_data:/app/pb_data

volumes:
  tracknote_data:
