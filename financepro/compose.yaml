# financepro — FinancePro — huishoudboekje (PocketBase + UI)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
#
# name: vast projectnaam — het volume heet financepro_financepro_data en dat mag
# niet verschuiven als de stack uit een andere map (Dockhand) wordt gedeployed.
name: financepro

services:
  app:
    image: ghcr.io/s4ndyp/financepro:latest
    pull_policy: always
    container_name: financepro
    restart: unless-stopped
    ports:
      - "${FINANCEPRO_PORT:-80}:8090"
    volumes:
      - financepro_data:/app/pb_data

volumes:
  financepro_data:
