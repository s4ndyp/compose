# uptime-kotlin — UptimeKotlin zelf-hosted uptime-monitor (Quarkus native + PostgreSQL)
#
# Bron: github.com/TheoMeunier/uptime-kotlin README quickstart (image ghcr, amd64+arm64).
# Eén image draait web-UI, API én checks; PostgreSQL is de enige afhankelijkheid.
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
# Verplicht (anders faalt de deploy met een duidelijke melding):
#   ENCRYPTION_MASTER_KEY = openssl rand -base64 32
#   UPTIME_DB_PASSWORD    = bijv. openssl rand -hex 20
# Zet deze in Dockhand via Stack → Environment (raw .env), of lokaal in een .env-bestand.
#
# De app weigert te starten met de placeholder-MASTER-KEY uit de docs; bewaar de
# ENCRYPTION_MASTER_KEY offline — zonder deze sleutel zijn opgeslagen secrets
# (notifikanalen, DB-controle-wachtwoorden) onleesbaar.
# Eerste account dat je aanmaakt op http://<lxc-ip>/ is je admin-account.
#
# mem_limit 512m is geen luxe: de native heap wordt geschaald op het limiet dat de
# container ziet (~50 MB met limiet, paar honderd MB zonder). LXC hierboven: 2048 MB.

services:
  uptime-kotlin:
    image: ghcr.io/theomeunier/uptime-kotlin:latest
    pull_policy: always
    container_name: uptime-kotlin
    restart: unless-stopped
    mem_limit: 512m
    ports:
      # browser-UI + API + statuspagina's: host 80, intern luistert Quarkus op 8080
      - "${UPTIME_KOTLIN_PORT:-80}:8080"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      QUARKUS_DATASOURCE_USERNAME: uptime-kotlin
      QUARKUS_DATASOURCE_PASSWORD: ${UPTIME_DB_PASSWORD:?Zet UPTIME_DB_PASSWORD in Dockhand Stack-Environment}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/uptime-kotlin
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Zet ENCRYPTION_MASTER_KEY in Dockhand Stack-Environment (openssl rand -base64 32)}
      MP_JWT_VERIFY_ISSUER: ${MP_JWT_VERIFY_ISSUER:-https://issuer.uptime-kotlin.com}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.4-alpine
    container_name: uptime-kotlin-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptime-kotlin
      POSTGRES_USER: uptime-kotlin
      POSTGRES_PASSWORD: ${UPTIME_DB_PASSWORD:?Zet UPTIME_DB_PASSWORD in Dockhand Stack-Environment}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Alleen intern (container-netwerk); géén host-poort.
    volumes:
      - uptime_kotlin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime-kotlin -d uptime-kotlin"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  uptime_kotlin_pgdata:
