name: camera-relay

# TESTOPSTELLING CT173 'camtest' (hersteld 2026-11-22) — A/B vergelijking voor
# camera 192.168.2.11 (Xiongmai XM530), die in Protect periodiek wegvalt.
#
# Test A: 10.5.0.173  -> bron = Dahua NVR 192.168.2.251 kanaal 2 (zoals de oude koppeling)
# Test B: 10.5.0.90   -> bron = de camera zelf, RTSP 554, buiten de NVR om  [TIJDELIJK UIT 22-11-2026]
# Beide lopen door go2rtc (1 sessie per bron) en worden door dezelfde ONVIF-bridge
# als twee aparte virtuele camera's aan Protect aangeboden.
#
# Credentials komen uit Infisical /camera-relay via de Dockhand secret-provider
# (stack-variabele DOCKHAND_SECRET_SELECTOR); ze staan niet in dit bestand.

configs:
  go2rtc.yaml:
    content: |
      log:
        level: info
      api:
        listen: ":1984"
      rtsp:
        listen: ":8555"
      streams:
        # Test A: NVR-relay, kanaal 2
        cam_nvr: "rtsp://${NVR_USER:?NVR_USER ontbreekt in Infisical /camera-relay}:${NVR_PASS:?NVR_PASS ontbreekt in Infisical /camera-relay}@192.168.2.251:554/cam/realmonitor?channel=2&subtype=0"
        # Test B: camera rechtstreeks
        # Test B TIJDELIJK UIT 22-11-2026 (kost een sessie op 192.168.2.11):
        # cam: "rtsp://${CAM_USER}:${CAM_PASS}@192.168.2.11:554/cam/realmonitor?channel=1&subtype=0"
  onvif.yaml:
    content: |
      onvif:
        # Test A — via de NVR (kanaal 2)
        - name: Camera 192.168.2.11 (test A, via NVR)
          uuid: 5e1a7c30-9b44-4f2e-8d17-2c6f0a9b1d41
          hostname: 10.5.0.173
          manufacturer: Xiongmai
          model: XM530_R80X20-PQ_8M
          ports:
            server: 80
            rtsp: 8554
          highQuality:
            rtsp: /cam_nvr
            width: 1920
            height: 1080
            framerate: 12
            bitrate: 2048
            quality: 4
          target:
            hostname: 127.0.0.1
            ports:
              rtsp: 8555
      metrics:
        port: 9180

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: camtest-go2rtc
    network_mode: host
    restart: unless-stopped
    configs:
      - source: go2rtc.yaml
        target: /config/go2rtc.yaml

  bridge:
    image: ghcr.io/mz738/rtsp2unifi-protect:2.2.2
    container_name: camtest-bridge
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    depends_on:
      - go2rtc
    configs:
      - source: onvif.yaml
        target: /onvif.yaml