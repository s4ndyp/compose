# stream.conf — CHILD-agent op RNAZ: stuurt deze host naar de Netdata-parent.
# Wordt bij de deploy door de repo-init-container in het config-volume gezet; de
# placeholder @NETDATA_STREAM_API_KEY@ komt uit Infisical (map /netdata) en is dezelfde
# sleutel als het blok in de stream.conf van de parent (10.5.0.144).
#
# Zolang de node niet in het dashboard van de parent verschijnt: kijk in
# `docker logs netdata-child-rnaz` naar regels met "STREAM" (verbinden/afwijzen) en
# controleer dat de parent bereikbaar is: `nc -z 10.5.0.144 19999`.

[stream]
    # aan = deze host levert metrics aan de parent
    enabled = yes
    # de parent (Netdata-LXC op Proxnux2); poort 19999 is de streaming-poort van de parent
    destination = 10.5.0.144:19999
    # gedeelde sleutel; de parent accepteert alleen streams met deze sleutel
    api key = @NETDATA_STREAM_API_KEY@
    # alles meesturen (alle charts van deze node)
    send charts matching = *
    # buffer voor korte netwerkonderbrekingen naar de parent
    buffer size = 10 MB
    # hoe lang wachten tussen reconnect-pogingen
    reconnect delay = 5
