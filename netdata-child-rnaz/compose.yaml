# netdata-child-rnaz — Netdata CHILD-agent op de Unraid-host RNAZ (10.1.1.4)
#
# Doel: de host-, container- en Unraid-statistieken van RNAZ naar de Netdata-PARENT
# (LXC 144, 10.5.0.144:19999) streamen. De parent bewaart de historie (tiers 2GiB/1GiB/1GiB),
# deze container meet alleen en heeft daarom een kleine eigen opslag (db mode = ram).
#
# Waarom een eigen container i.p.v. een Unraid-plugin: netdata levert geen Unraid-integratie,
# maar de agent draait prima als Docker-container zolang hij de host-namespaces ziet
# (pid: host + /proc,/sys,/etc van de host read-only). Zo verschijnt RNAZ als node in
# het dashboard van de parent, met dezelfde charts als elke andere netdata-host.
#
# Geen gepubliceerde poorten: deze node is bedoeld om via de parent bekeken te worden
# (host-poort 80 is hier dus niet nodig — de één-80-mapping-regel geldt voor browser-apps).
# Wil je tóch een lokaal dashboard op RNAZ, voeg dan "19999:19999" toe.
#
# Config: named volume + eenmalige repo-init-container (bestands-binds werken niet op een
# externe Dockhand-daemon). Geheimen staan niet in git: de placeholder @NETDATA_STREAM_API_KEY@
# in stream.conf wordt bij de deploy vervangen door de waarde van de stack-variabele
# NETDATA_STREAM_API_KEY uit Infisical (map /netdata via DOCKHAND_SECRET_SELECTOR=/netdata).
# Dat is dezelfde sleutel die de parent in zijn stream.conf accepteert.
#
# Beheer: Dockhand-env 11 (RNAZ, tcp://10.1.1.4:2376). Uitzetten = stack stoppen in Dockhand.
name: netdata-child-rnaz

services:
  # Eenmalige initialisatie van het config-volume (idempotent: overschrijft de bestanden).
  netdata-child-repo-init:
    container_name: netdata-child-rnaz-repo-init
    image: alpine:3.22
    entrypoint:
      - sh
      - -c
      - |
        set -e
        BASE=https://raw.githubusercontent.com/s4ndyp/compose/main/netdata-child-rnaz
        wget -q -O /etc/netdata/netdata.conf  "$$BASE/netdata.conf"
        wget -q -O /tmp/stream.conf.tpl       "$$BASE/stream.conf"
        sed "s|@NETDATA_STREAM_API_KEY@|$$NETDATA_STREAM_API_KEY|" /tmp/stream.conf.tpl > /etc/netdata/stream.conf
        rm -f /tmp/stream.conf.tpl
        grep -q . /etc/netdata/netdata.conf /etc/netdata/stream.conf
        echo "netdata-child config-initialisatie klaar"
    restart: "no"
    environment:
      # Gedeelde stream-sleutel met de parent; uit Infisical (map /netdata).
      NETDATA_STREAM_API_KEY: ${NETDATA_STREAM_API_KEY:?Zet NETDATA_STREAM_API_KEY in Infisical map /netdata (of Dockhand Stack-Environment)}
    volumes:
      - netdata_child_config:/etc/netdata

  netdata-child:
    container_name: netdata-child-rnaz
    image: netdata/netdata:v2.12.3
    # hostnaam = de nodenaam in het dashboard van de parent
    hostname: rnaz
    restart: unless-stopped
    # eigen PID-namespace van de Unraid-host: anders ziet de collector alleen zichzelf
    pid: host
    cap_add:
      - SYS_PTRACE
    environment:
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      # config (netdata.conf + stream.conf) — gevuld door netdata-child-repo-init
      - netdata_child_config:/etc/netdata
      # kleine eigen opslag; de historie staat bij de parent
      - netdata_child_lib:/var/lib/netdata
      - netdata_child_cache:/var/cache/netdata
      # host-metrics van de Unraid-host (prefix /host = 'host access prefix')
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      # De Unraid-array zichtbaar maken voor de diskspace-collector. LET OP het pad: met een
      # host-prefix (/host) stat Netdata elke mount op '<prefix>/root<mountpoint>', dus
      # /mnt/user moet binnen de container op /host/root/mnt/user staan — een bind op /mnt:/mnt
      # is onvoldoende (de collector ziet die mounts dan niet en chart alleen zijn eigen volume).
      # rslave zodat schijven die Unraid later mount/uitzet zichtbaar blijven.
      - type: bind
        source: /mnt
        target: /host/root/mnt
        read_only: true
        bind:
          propagation: rslave
      # container-metrics van de Unraid-host
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      netdata-child-repo-init:
        condition: service_completed_successfully

volumes:
  netdata_child_config:
  netdata_child_lib:
  netdata_child_cache:
