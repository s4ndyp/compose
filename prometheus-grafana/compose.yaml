        "uid": "syncthing-homelab",
        "title": "Syncthing",
        "description": "Beide Syncthing-instanties: CT139 sync-naz en 10.5.0.134 ignis-syncthing.",
        "tags": [
          "syncthing",
          "homelab"
        ],
        "timezone": "browser",
        "editable": true,
        "graphTooltip": 1,
        "refresh": "30s",
        "schemaVersion": 39,
        "version": 0,
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "instance",
              "label": "Instantie",
              "type": "query",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              },
              "query": {
                "qryType": 1,
                "query": "label_values(up{job=~\"syncthing.*\"}, instance)",
                "refId": "A"
              },
              "refresh": 2,
              "includeAll": true,
              "multi": true,
              "current": {
                "selected": true,
                "text": [
                  "All"
                ],
                "value": [
                  "$$__all"
                ]
              }
            },
            {
              "name": "folder",
              "label": "Map",
              "type": "query",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              },
              "query": {
                "qryType": 1,
                "query": "label_values(syncthing_model_folder_summary{instance=~\"$$instance\"}, folder)",
                "refId": "A"
              },
              "refresh": 2,
              "includeAll": true,
              "multi": true,
              "current": {
                "selected": true,
                "text": [
                  "All"
                ],
                "value": [
                  "$$__all"
                ]
              }
            }
          ]
        },
        "annotations": {
          "list": []
        },
        "panels": [
          {
            "id": 1,
            "type": "stat",
            "title": "Instantie bereikbaar",
            "description": "1 = de /metrics-endpoint antwoordt, 0 = de scrape mislukt.",
            "datasource": {
              "type": "prometheus",
              "uid": "PBFA97CFB590B2093"
            },
            "gridPos": {
              "h": 5,
              "w": 5,
