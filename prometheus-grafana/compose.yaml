                    "options": {
                      "match": "exact",
                      "1": {
                        "color": "green",
                        "index": 0,
                        "text": "Up"
                      }
                    },
                    "type": "value"
                  },
                  {
                    "options": {
                      "match": "exact",
                      "0": {
                        "color": "red",
                        "index": 0,
                        "text": "Down"
                      }
                    },
                    "type": "value"
                  }
                ],
                "thresholds": {
