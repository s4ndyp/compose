                "titleSize": 12,
                "valueSize": 26
              }
            },
            "targets": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "PBFA97CFB590B2093"
                },
                "editorMode": "code",
                "expr": "up{job=~\"syncthing.*\", instance=~\"$$instance\"}",
                "instant": true,
                "legendFormat": "{{instance}}",
                "range": false,
                "refId": "A"
              }
            ]
          },
          {
            "id": 2,
