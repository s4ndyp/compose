# prometheus_grafana — Prometheus (metrics) + Grafana (dashboards) in één stack op één LXC
#
# Beide diensten zitten in hetzelfde compose-netwerk: Grafana leest de metrics via
# http://prometheus:9090 (interne naam, geen host-poort nodig).
#
# Poorten: 80 = Grafana (browser-route, homelab-conventie), 9090 = Prometheus.
# Prometheus krijgt een eigen domein (prometheus.xdio.nl) achter Zoraxy; een tweede
# 80-mapping kan niet, dus die route loopt via host-poort 9090.
#
# Configs staan INLINE (`configs:` met `content:`): een Dockhand-git-stack draait
# compose op de Dockhand-host terwijl de docker-daemon op deze LXC staat, dus
# relatieve `./bestand`-binds zouden daar op een lege map uitkomen. Inline configs
# reizen mee met de stack; een config-wijziging = dit bestand aanpassen + redeploy.
#
# Wachtwoord: GF_ADMIN_PASSWORD komt uit de Infisical-map `/prometheus_grafana`
# (Dockhand secret-provider, gestuurd door de stackvariabele
# DOCKHAND_SECRET_SELECTOR). Zonder die sleutel faalt de deploy bewust.
name: prometheus-grafana

services:
  prometheus:
    # Metrics-server + TSDB. v3.x: OTLP-endpoints standaard aan.
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # juiste links/redirects wanneer de UI via https://prometheus.xdio.nl loopt
      - --web.external-url=https://prometheus.xdio.nl
      # POST /-/reload (config herladen zonder herstart)
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      # TSDB (30 dagen retentie) — named volume, groeit mee met het aantal targets
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    environment:
      TZ: Europe/Amsterdam
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-80}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      # Datasource wordt voorgeprovisioneerd: geen handmatige koppeling nodig.
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
      # Dashboards worden ook voorgeprovisioneerd: provider + dashboard-JSON uit
      # deze stack, zodat een redeploy het dashboard terugzet/actualiseert.
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/syncthing.yaml
      - source: grafana_syncthing_dashboard
        target: /etc/grafana/dashboards/syncthing.json
      - source: grafana_unas_dashboard
        target: /etc/grafana/dashboards/unas.json
    environment:
      TZ: Europe/Amsterdam
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?zet GF_ADMIN_PASSWORD in Infisical /prometheus_grafana}
      # achter de Zoraxy-proxy op https
      GF_SERVER_ROOT_URL: https://grafana.xdio.nl
      GF_SERVER_DOMAIN: grafana.xdio.nl
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # --- Pocket ID (OIDC) --- native SSO; de lokale admin-login blijft als break-glass
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Pocket ID
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:?zet GRAFANA_OIDC_CLIENT_ID in Infisical /prometheus_grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?zet GRAFANA_OIDC_CLIENT_SECRET in Infisical /prometheus_grafana}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://pocket.xdio.nl/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://pocket.xdio.nl/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://pocket.xdio.nl/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # bestaande lokale admin koppelen op zelfde e-mailadres
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true"
      # Pocket ID kent geen rollen-claim voor deze client: SSO-gebruikers worden Admin
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

configs:
  prometheus_config:
    # Scrape-config: Prometheus zichzelf + Grafana's eigen /metrics. Nieuwe targets
    # (node-exporter, pve-exporter, Beszel, …) komen als extra job_name hieronder.
    content: |
      global:
        scrape_interval: 30s
        evaluation_interval: 30s
        external_labels:
          instance: homelab

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: grafana
          static_configs:
            - targets: ["grafana:3000"]

        # wg-easy (CT170, WireGuard-testtunnel homelab <-> ouders): /metrics/prometheus
        # staat achter een Bearer-token uit Infisical (/prometheus_grafana, via de
        # secret-provider; het token is dezelfde waarde als WG_EASY_METRICS_PASSWORD
        # in /wg-easy). Aanzetten/roteren doe je in wg-easy → Admin → General.
        - job_name: wg-easy
          metrics_path: /metrics/prometheus
          scrape_interval: 30s
          authorization:
            type: Bearer
            credentials: ${WG_EASY_METRICS_PASSWORD:?zet WG_EASY_METRICS_PASSWORD in Infisical /prometheus_grafana}
          static_configs:
            - targets: ["10.5.0.170:51821"]

        # Syncthing heeft een native /metrics op de GUI-poort (8384), geen exporter nodig.
        # Twee instanties: CT139 'sync-naz' (syncthing.xdio.nl) en 10.5.0.134 (ignis-syncthing.xdio.nl).
        - job_name: syncthing
          static_configs:
            - targets: ["10.5.0.139:8384"]
              labels:
                instance: syncthing-naz
        - job_name: syncthing-ignis
          static_configs:
            - targets: ["10.5.0.134:8384"]
              labels:
                instance: syncthing-ignis

        # unpoller (CT156): UniFi-controller (Network API) + UNAS Pro (UniFi Drive)
        # in één exporter; /metrics op 9130. UNAS via een lokaal Drive-account.
        - job_name: unpoller
          scrape_interval: 60s
          static_configs:
            - targets: ["10.5.0.156:9130"]

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 30s

  # Grafana-dashboard-provider: leest JSON uit /etc/grafana/dashboards (het
  # config-bestand hieronder). Een nieuw dashboard toevoegen = nieuw config-blok
  # + mount in de grafana-service.
  grafana_dashboards_provider:
    content: |
      apiVersion: 1
      providers:
        - name: syncthing
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /etc/grafana/dashboards
            foldersFromFilesStructure: false

  # Het Syncthing-dashboard (uid syncthing-homelab): 16 panels over de twee
  # Syncthing-instanties (CT139 sync-naz + 10.5.0.134 ignis) — bereikbaarheid,
  # verbindingen per device, doorvoer, mapgroottes, need-bytes, scans, conflicten.
  grafana_syncthing_dashboard:
    content: |
