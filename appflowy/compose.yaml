# appflowy — AppFlowy Cloud (self-hosted workspace-/notitie-app, Rust + Postgres + MinIO-S3)
#
# Draait in CT 144 (10.5.0.144) onder Dockhand. Browser-route is host-poort 80
# (homelab-conventie); daarachter zet de eigen nginx de web-app (/), de API (/api),
# de auth (/gotrue), de websocket (/ws), objectopslag (/minio + /minio-api) en de
# admin-console (/console) op één origin. TLS doet Zoraxy op appflowy.xdio.nl.
#
# Afgeleid van docker-compose.yml uit AppFlowy-IO/AppFlowy-Cloud (branch main), met
# deze bewuste afwijkingen:
#   * nginx serveert alleen http op poort 80: de upstream ssl_certificaatpaden en de
#     443-listener zijn uit de config (die staat in appflowy/nginx.conf) en de config
#     komt uit een config-volume dat `repo-init` vult — bestands-binds (./nginx/…)
#     werken niet op een externe Dockhand-daemon.
#   * minio/minio bestaat niet meer: MinIO heeft in 2025/2026 de community-images van
#     Docker Hub gehaald en quay.io weigert anonieme pulls. Daarom draait de
#     onderhouden MinIO-fork pgsty/silo (zelfde S3-API, zelfde MINIO_*-variabelen,
#     zelfde schijf-formaat), zodat de rest van de stack 1-op-1 upstream blijft.
#   * appflowy_ai is weggelaten (vereist een OpenAI-key voor embeddings); pgadmin en de
#     Cloudflare-tunnel zijn optioneel en overgeslagen. appflowy_search blijft wél:
#     dat levert trefwoord-zoeken zónder AI-key.
#   * image-tags gepind op de actuele release in plaats van `latest`.
#
# Verplichte secrets komen uit Infisical-map /appflowy (Dockhand-stackvariabele
# DOCKHAND_SECRET_SELECTOR=/appflowy): POSTGRES_PASSWORD, GOTRUE_JWT_SECRET,
# GOTRUE_ADMIN_EMAIL, GOTRUE_ADMIN_PASSWORD, APPFLOWY_S3_ACCESS_KEY,
# APPFLOWY_S3_SECRET_KEY, APPFLOWY_BASE_URL, APPFLOWY_WEBSOCKET_BASE_URL.
# Upgraden = tag ophogen in dit bestand + redeployen; Postgres/cloud migreren zelf.
name: appflowy

services:
  # Haalt appflowy/nginx.conf uit deze repo het config-volume in. De URL is op een
  # commit-SHA gepind (stackvariabele APPFLOWY_CONF_REF) omdat
  # raw.githubusercontent.com ~5 minuten cachet — zonder pin kan een verse push de
  # oude config serveren. Bij een configwijziging: SHA bijwerken en redeployen.
  repo-init:
    image: alpine:3.24
    restart: "no"
    entrypoint: ["sh", "-c"]
    # Eén-rij-array naast een list-entrypoint: anders splitst compose het commando
    # in losse woorden en draait alleen `wget`.
    command:
      - wget -q -O /config/nginx.conf https://raw.githubusercontent.com/s4ndyp/compose/$${APPFLOWY_CONF_REF}/appflowy/nginx.conf && echo nginx-conf-ok
    environment:
      APPFLOWY_CONF_REF: ${APPFLOWY_CONF_REF:?commit-sha van s4ndyp/compose ontbreekt (stackvariabele)}
    volumes:
      - appflowy_conf:/config

  nginx:
    image: nginx:1.31.8-alpine
    restart: on-failure
    # De config staat in een volume, niet op /etc/nginx/nginx.conf (daar zit een
    # bestand in het image) — vandaar de expliciete -c.
    command: ["-c", "/etc/nginx/appflowy/nginx.conf", "-g", "daemon off;"]
    ports:
      - "${APPFLOWY_HTTP_PORT:-80}:80"
    volumes:
      - appflowy_conf:/etc/nginx/appflowy:ro

  # Objectopslag voor uploads/bijlagen (S3-API op 9000, console op 9001).
  # Service heet bewust `minio`: upstream-URL's (http://minio:9000) blijven zo kloppen.
  # Geen healthcheck: het image heeft geen curl/wget en niets wacht erop.
  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    restart: on-failure
    command: server /data --console-address ":9001"
    environment:
      MINIO_BROWSER_REDIRECT_URL: ${APPFLOWY_BASE_URL:?}/minio
      MINIO_ROOT_USER: ${APPFLOWY_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${APPFLOWY_S3_SECRET_KEY:?}
    volumes:
      - minio_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_HOST: postgres
      PGPORT: "5432"
    command: ["postgres", "-c", "port=5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.8.4-alpine
    restart: on-failure

  # Supabase-GoTrue-fork van AppFlowy: machtigt gebruikers en maakt bij de start de
  # admin-user uit GOTRUE_ADMIN_EMAIL/PASSWORD aan (en draait de migraties).
  gotrue:
    image: appflowyinc/gotrue:0.20.6
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://127.0.0.1:9999/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      GOTRUE_ADMIN_EMAIL: ${GOTRUE_ADMIN_EMAIL:?}
      GOTRUE_ADMIN_PASSWORD: ${GOTRUE_ADMIN_PASSWORD:?}
      # Open signup (LAN-only app; GOTRUE_DISABLE_SIGNUP=true zet registratie dicht —
      # accounts maak je dan aan in de admin-console op /console).
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      # Bevestigingsmails uit: er is geen SMTP gekoppeld (mailcow-VM 141 staat uit) en
      # met autoconfirm=true is een account direct actief. SMTP-variabelen blijven leeg;
      # GOTRUE_MAILER_AUTOCONFIRM=false + echte SMTP-waarden zet je hier neer als je
      # mailbevestiging wel wilt.
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SMTP_PORT: "465"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: ""
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ""
      GOTRUE_SMTP_MAX_FREQUENCY: 1ns
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100"
      GOTRUE_SITE_URL: appflowy-flutter://
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?}
      # 7 dagen: de web-/desktopclients vernieuwen hun token niet altijd op tijd en
      # logden daardoor om de 2 uur uit (upstream-default sinds 0.21.x).
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-604800}
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: ${APPFLOWY_BASE_URL:?}/gotrue
      # Let op: wachtwoord mag geen URL-specialtekens bevatten (hex-waarden zijn veilig).
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres?search_path=auth
      PORT: "9999"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /gotrue/verify
      # Externe identity providers: uit (koppelen kan later via Pocket ID-gate, maar
      # AppFlowy heeft geen generieke OIDC zonder Google/GitHub/Discord-app).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ""
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ""
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${APPFLOWY_BASE_URL:?}/gotrue/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "false"
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ""
      GOTRUE_EXTERNAL_GITHUB_SECRET: ""
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${APPFLOWY_BASE_URL:?}/gotrue/callback
      GOTRUE_EXTERNAL_DISCORD_ENABLED: "false"
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ""
      GOTRUE_EXTERNAL_DISCORD_SECRET: ""
      GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI: ${APPFLOWY_BASE_URL:?}/gotrue/callback
      GOTRUE_SAML_ENABLED: "false"
      GOTRUE_SAML_PRIVATE_KEY: ""

  # De API + websocket-server. Draait bij de start zelf de sqlx-migraties op Postgres.
  appflowy_cloud:
    image: appflowyinc/appflowy_cloud:0.21.9
    restart: on-failure
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      APPFLOWY_REDIS_URI: redis://redis:6379
      APPFLOWY_GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?}
      APPFLOWY_GOTRUE_BASE_URL: http://gotrue:9999
      APPFLOWY_ACCESS_CONTROL: "true"
      APPFLOWY_DATABASE_MAX_CONNECTIONS: "40"
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL:?}
      APPFLOWY_WEB_URL: ${APPFLOWY_BASE_URL:?}
      # S3/MinIO (silo). Presigned URL's lopen via nginx/minio-api, zodat downloads
      # vanaf hetzelfde https-origin komen als de web-app (geen mixed content).
      APPFLOWY_S3_CREATE_BUCKET: "true"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY:?}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY:?}
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_S3_REGION: us-east-1
      APPFLOWY_S3_PRESIGNED_URL_ENDPOINT: ${APPFLOWY_BASE_URL:?}/minio-api
      # Zoeken: appflowy_search doet het trefwoord-zoeken; AI staat uit (geen key).
      APPFLOWY_SEARCH_SERVICE_URL: http://appflowy_search:4002
      APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS: "10"
      AI_ENABLED: "false"
      AI_SERVER_HOST: ""
      AI_SERVER_PORT: "5001"
      AI_OPENAI_API_KEY: ""
      ASSEMBLYAI_API_KEY: ""
      ASSEMBLYAI_API_BASE: https://api.assemblyai.com/v2
      ASSEMBLYAI_STREAMING_API_BASE: https://streaming.assemblyai.com/v3
      SIGNUP_WHITELIST_ENABLED: "false"
      GUEST_INVITES_REQUIRE_ADMIN_APPROVAL: "false"
      # Mailer leeg (zelfde reden als bij gotrue).
      APPFLOWY_MAILER_SMTP_HOST: ""
      APPFLOWY_MAILER_SMTP_PORT: "465"
      APPFLOWY_MAILER_SMTP_USERNAME: ""
      APPFLOWY_MAILER_SMTP_EMAIL: ""
      APPFLOWY_MAILER_SMTP_PASSWORD: ""
      APPFLOWY_MAILER_SMTP_TLS_KIND: wrapper
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    depends_on:
      gotrue:
        condition: service_healthy

  # Beheerconsole van de instance (users aanmaken, workspaces bekijken).
  admin_frontend:
    image: appflowyinc/admin_frontend:0.20.4
    restart: on-failure
    environment:
      APPFLOWY_GOTRUE_BASE_URL: http://gotrue:9999
      APPFLOWY_BASE_URL: http://appflowy_cloud:8000
    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  # Achtergrondtaken: imports, exports, bestandsverwerking.
  appflowy_worker:
    image: appflowyinc/appflowy_worker:0.21.9
    restart: on-failure
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_WORKER_ENVIRONMENT: production
      APPFLOWY_WORKER_REDIS_URL: redis://redis:6379
      APPFLOWY_WORKER_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      APPFLOWY_WORKER_DATABASE_NAME: postgres
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: "30"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY:?}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY:?}
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_S3_REGION: us-east-1
      APPFLOWY_MAILER_SMTP_HOST: ""
      APPFLOWY_MAILER_SMTP_PORT: "465"
      APPFLOWY_MAILER_SMTP_USERNAME: ""
      APPFLOWY_MAILER_SMTP_EMAIL: ""
      APPFLOWY_MAILER_SMTP_PASSWORD: ""
      APPFLOWY_MAILER_SMTP_TLS_KIND: wrapper
      TZ: Europe/Amsterdam
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  # Zoekdienst: trefwoord-index (tantivy) op het collab-blobs; werkt zonder AI-key
  # (de embedding-indexer staat uit).
  appflowy_search:
    image: appflowyinc/appflowy_search:0.21.9
    restart: on-failure
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_SEARCH_HOST: "[::]"
      APPFLOWY_SEARCH_PORT: "4002"
      APPFLOWY_SEARCH_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      APPFLOWY_SEARCH_REDIS_URL: redis://redis:6379
      AI_OPENAI_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_ENDPOINT: ""
      AZURE_OPENAI_API_VERSION: ""
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY:?}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY:?}
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_S3_REGION: us-east-1
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "true"
      APPFLOWY_INDEXER_DATABASE_ENABLED: "false"
      APPFLOWY_KEYWORD_SEARCH_ENABLED: "true"
      APPFLOWY_KEYWORD_WORKER_ENABLED: "true"
      APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES: "2147483648"
      APPFLOWY_KEYWORD_INDEX_DIR: /var/lib/appflowy/keyword_index
      APPFLOWY_GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?}
    volumes:
      - keyword_index_data:/var/lib/appflowy/keyword_index
    healthcheck:
      # Het image heeft geen curl/wget; via bash /dev/tcp praten we HTTP zonder extra
      # binary ($$ escapet de compose-interpolatie).
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/$${APPFLOWY_SEARCH_PORT:-4002}
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r _ status _ <&3
          [ "$$status" = 200 ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # De web-client (static SPA). Krijgt de publieke URL's mee zodat ze niet naar het
  # interne netwerk wijzen.
  appflowy_web:
    image: appflowyinc/appflowy_web:0.20.15
    restart: on-failure
    environment:
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL:?}
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_BASE_URL:?}/gotrue
      APPFLOWY_WS_BASE_URL: ${APPFLOWY_WEBSOCKET_BASE_URL:?}
    depends_on:
      appflowy_cloud:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  keyword_index_data:
  appflowy_conf:
