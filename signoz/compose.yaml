# SigNoz — self-hosted observability (OpenTelemetry traces/metrics/logs).
# Externe app: gegenereerd door SigNoz Foundry (foundryctl forge, casting
# flavor=compose/mode=docker) en aangepast aan de stackregels van deze repo.
# Upstream distributeert geen compose-bestanden meer sinds v0.130.0; Foundry is de
# ondersteunde route. Images gepind: signoz/signoz v0.149.0,
# signoz/signoz-otel-collector v0.144.15, clickhouse 25.12.5, postgres 16.
# Upgraden: nieuwe tags op Docker Hub (signoz/signoz, signoz/signoz-otel-collector)
# en/of de Foundry-docs (https://signoz.io/docs/install/docker/) volgen.
#
# Browser-route is ALTIJD host-poort 80 op het LXC (Signoz UI, intern 8080).
# De OTel-collector is geen browser-dienst: OTLP-inname houdt eigen poorten
# 4317 (gRPC) en 4318 (HTTP) — andere hosts op het netwerk sturen daar telemetry.
# ClickHouse, Postgres en Keeper hebben géén host-poort: die blijven alleen
# bereikbaar binnen het docker-netwerk. Het Postgres-wachtwoord is de
# Foundry-standaard ('signoz'); de DB is vanaf buiten niet bereikbaar.
#
# BELANGRIJK (afwijking van Foundry-origin): de config-bestanden (ingester.yaml,
# opamp.yaml, keeper-0.yaml, config-0-0.yaml, functions.yaml) worden NIET als
# bestands-bind gemount. Deze stack draait via Dockhand op een EXTERNE
# docker-daemon (eigen LXC): relatieve ./paden existeerren daar niet en docker
# maakt er lege mappen van (keeper crasht dan met segfault/exit 139). In plaats
# daarvan downloadt de eenmalige 'signoz-repo-init'-container de vijf files uit
# deze repo (main) in de named volume 'signoz-config', en elk programma leest
# ze read-only uit /etc/signoz. Zie ook snapzilla: zelfde repo-init-patroon.
name: signoz
networks:
  signoz-network:
    name: signoz-network
services:
  signoz-repo-init:
    container_name: signoz-repo-init
    image: alpine:3.22
    entrypoint:
      - sh
      - -c
      - |
        set -e
        BASE=https://raw.githubusercontent.com/s4ndyp/compose/main/signoz
        wget -q -O /conf/ingester.yaml          "$$BASE/ingester/ingester.yaml"
        wget -q -O /conf/opamp.yaml             "$$BASE/ingester/opamp.yaml"
        wget -q -O /conf/keeper-0.yaml          "$$BASE/telemetrykeeper/clickhousekeeper/keeper-0.yaml"
        wget -q -O /conf/config-0-0.yaml       "$$BASE/telemetrystore/clickhouse/config-0-0.yaml"
        wget -q -O /conf/functions.yaml         "$$BASE/telemetrystore/clickhouse/functions.yaml"
        grep -q . /conf/ingester.yaml /conf/opamp.yaml /conf/keeper-0.yaml /conf/config-0-0.yaml /conf/functions.yaml
        echo "signoz config-initialisatie klaar"
    restart: "no"
    volumes:
      - signoz-config:/conf
  ingester:
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/signoz/ingester.yaml --manager-config=/etc/signoz/opamp.yaml --copy-path=/var/tmp/collector-config.yaml
    deploy:
      replicas: 1
    entrypoint:
      - /bin/sh
    depends_on:
      signoz-repo-init:
        condition: service_completed_successfully
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    image: signoz/signoz-otel-collector:v0.144.15
    networks:
      signoz-network:
        aliases:
          - signoz-ingester
    ports:
      - "4317:4317" # OTLP gRPC-ontvanger (niet-browser, eigen poort)
      - "4318:4318" # OTLP HTTP-ontvanger (niet-browser, eigen poort)
    restart: unless-stopped
    volumes:
      - signoz-config:/etc/signoz:ro
  signoz-metastore-postgres-0:
    container_name: signoz-metastore-postgres-0
    environment:
      - POSTGRES_DB=signoz
      - POSTGRES_PASSWORD=***
      - POSTGRES_USER=signoz
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U signoz -d signoz
      timeout: 10s
    image: postgres:16
    networks:
      - signoz-network
    restart: unless-stopped
    volumes:
      - signoz-metastore-postgres-0-data:/var/lib/postgresql/data
  signoz-signoz-0:
    container_name: signoz-signoz-0
    environment:
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:***@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      timeout: 10s
    image: signoz/signoz:v0.149.0
    networks:
      - signoz-network
    ports:
      - "${APP_PORT:-80}:8080" # browser-route: altijd host-poort 80, UI luistert intern op 8080
    restart: unless-stopped
  signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: signoz-telemetrykeeper-clickhousekeeper-0
    depends_on:
      signoz-repo-init:
        condition: service_completed_successfully
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/signoz/keeper-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - clickhouse-keeper-client
        - -h
        - localhost
        - -p
        - "9181"
        - -q
        - ls
      timeout: 10s
    image: clickhouse/clickhouse-keeper:25.12.5
    networks:
      - signoz-network
    restart: unless-stopped
    volumes:
      - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - signoz-config:/etc/signoz:ro
  signoz-telemetrystore-clickhouse-0-0:
    container_name: signoz-telemetrystore-clickhouse-0-0
    depends_on:
      signoz-repo-init:
        condition: service_completed_successfully
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/signoz/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8123/ping
      timeout: 10s
    image: clickhouse/clickhouse-server:25.12.5
    networks:
      - signoz-network
    restart: unless-stopped
    volumes:
      - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - signoz-config:/etc/signoz:ro
  signoz-telemetrystore-clickhouse-user-scripts:
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    container_name: signoz-telemetrystore-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:25.12.5
    networks:
      - signoz-network
    restart: on-failure
    volumes:
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
  signoz-telemetrystore-migrator:
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    container_name: signoz-telemetrystore-migrator
    entrypoint:
      - /bin/sh
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:v0.144.15
    networks:
      - signoz-network
    restart: on-failure
  signoz-pve-conf-init:
    # Schrijft de pve-exporter-config (incl. API-token) in een volume — het token Geheim
    # komt via de Dockhand-stackvariabelen (PVE_TOKEN_VALUE) en staat NOOIT in de git-repo.
    container_name: signoz-pve-conf-init
    image: alpine:3.22
    restart: "no"
    environment:
      - PVE_TOKEN_VALUE=${PVE_TOKEN_VALUE:-}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        test -n "$$PVE_TOKEN_VALUE" || { echo "PVE_TOKEN_VALUE ontbreekt"; exit 1; }
        printf 'default:\n  host: 10.1.1.10\n  user: root@pam\n  token_name: Hermes\n  token_value: %s\n  verify_ssl: false\n' "$$PVE_TOKEN_VALUE" > /etc/pveconf/pve.yml
        echo "pve.yml geschreven"
    volumes:
      - signoz-pve-conf:/etc/pveconf
  pve-exporter:
    # Proxmox VE cluster-metrics (o.a. per-node storage/schijf: pve_storage_* bytes).
    # Geen host-poort: alleen de OTel-collector scrapet hem intern op 9221.
    container_name: signoz-pve-exporter
    image: prompve/prometheus-pve-exporter:3.11.0
    restart: unless-stopped
    depends_on:
      signoz-pve-conf-init:
        condition: service_completed_successfully
    volumes:
      - signoz-pve-conf:/etc/prometheus:ro
    networks:
      - signoz-network
volumes:
  signoz-config:
    name: signoz-config
  signoz-pve-conf:
    name: signoz-pve-conf
  signoz-metastore-postgres-0-data:
    name: signoz-metastore-postgres-0-data
  signoz-telemetrykeeper-0-data:
    name: signoz-telemetrykeeper-0-data
  signoz-telemetrystore-0-0-data:
    name: signoz-telemetrystore-0-0-data
  signoz-telemetrystore-user-scripts:
    name: signoz-telemetrystore-user-scripts
