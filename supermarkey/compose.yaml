# supermarkey — SuperMarkey — boodschappen-app (nginx static + PWA)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  app:
    image: ghcr.io/s4ndyp/supermarkey:latest
    pull_policy: always
    container_name: supermarkey
    restart: unless-stopped
    ports:
      - "${SUPERMARKEY_PORT:-80}:80"
