# gpstag — GPSTag — GPS-tracker (PocketBase + hooks)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  gpstag:
    image: ghcr.io/s4ndyp/gpstag:latest
    pull_policy: always
    container_name: gpstag
    restart: unless-stopped
    ports:
      - "${GPSTAG_PORT:-80}:8090"
    environment:
      - TZ=Europe/Amsterdam
    # pb_public/pb_hooks/pb_migrations zitten in de image; alleen data persistent.
    volumes:
      - gpstag_data:/pb/pb_data

volumes:
  gpstag_data:
