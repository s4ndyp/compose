# crossdesk — CrossDesk Server (self-hosted signalering + TURN-relay voor de CrossDesk-clients)
#
# Externe app (geen eigen repo): deze stack staat in s4ndyp/compose. Draait in een eigen
# LXC onder Dockhand. Componenten:
#   crossdesk-server : WSS-signalering, device-identiteit/wachtwoord-check, online-status,
#                      sessie-coördinatie en het uitgeven van tijdelijke TURN-credentials.
#                      Luistert op CROSSDESK_SERVER_PORT (9099/TCP, WSS+HTTPS) en serveert
#                      daar ook de web-admin op /admin en het status-endpoint /stats.
#   coturn           : relay voor media/data als P2P niet lukt — poort 3478 (TCP+UDP) +
#                      UDP-range MIN_PORT-MAX_PORT.
# Data: SQLite-db + auto-gegenereerd TLS-cert onder /var/lib/crossdesk (bind-mount), logs
# onder /var/log/crossdesk. Draait in HOST-netwerk (rauwe WSS/TURN-poorten, echte peer-IP's),
# net als de rustdesk-stack.
#
# Verplichte stackvariabelen (gewone, niet-geheime): EXTERNAL_IP (= publiek adres dat in het
#   cert komt), INTERNAL_IP (= lokaal adres dat coturn bindt).
# Verplichte secrets (uit Infisical-map /crossdesk via DOCKHAND_SECRET_SELECTOR):
#   COTURN_AUTH_SECRET, COTURN_STATELESS_NONCE_SECRET   (elk `openssl rand -hex 32`)
#   ADMIN_USERNAME, ADMIN_PASSWORD                       (web-admin op /admin; leeg = admin uit)
# Certificaat: bij de eerste start wordt ZELFondertekend een cert gegenereerd dat alleen
#   EXTERNAL_IP dekt. Clients importeren `api.crossdesk.cn_root.crt` uit /var/lib/crossdesk/certs
#   (of er wordt een echt domeincert geplaatst). IP wijzigen regenereert een bestaand cert NIET.
# Upgraden: tag pinnen in stackvariabele CROSSDESK_IMAGE -> redeploy.
name: crossdesk

services:
  crossdesk-server:
    image: "${CROSSDESK_IMAGE:-crossdesk/crossdesk-server:v1.1.40}"
    container_name: crossdesk_server
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: ${CROSSDESK_NOFILE:-32768}
        hard: ${CROSSDESK_NOFILE:-32768}
    environment:
      EXTERNAL_IP: "${EXTERNAL_IP:?Zet EXTERNAL_IP in de stackvariabelen}"
      CROSSDESK_SERVER_PORT: "${CROSSDESK_SERVER_PORT:-9099}"
      COTURN_PUBLIC_HOST: "${COTURN_PUBLIC_HOST:-}"
      COTURN_PORT: "${COTURN_PORT:-3478}"
      COTURN_AUTH_SECRET: "${COTURN_AUTH_SECRET:?Zet COTURN_AUTH_SECRET in Infisical map /crossdesk}"
      CROSSDESK_ICE_SERVERS: "${CROSSDESK_ICE_SERVERS:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CROSSDESK_MAX_CONNECTIONS: "${CROSSDESK_MAX_CONNECTIONS:-8192}"
      CROSSDESK_LOG_RETENTION_DAYS: "${CROSSDESK_LOG_RETENTION_DAYS:-185}"
      CROSSDESK_OFFLINE_RETENTION_DAYS: "${CROSSDESK_OFFLINE_RETENTION_DAYS:-180}"
      CROSSDESK_RETENTION_INTERVAL_SECONDS: "${CROSSDESK_RETENTION_INTERVAL_SECONDS:-3600}"
    volumes:
      - "${CROSSDESK_DATA_DIR:-/var/lib/crossdesk}:/var/lib/crossdesk"
      - "${CROSSDESK_LOG_DIR:-/var/log/crossdesk}:/var/log/crossdesk"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/crossdesk/certs/api.crossdesk.cn.key && test -s /var/lib/crossdesk/certs/api.crossdesk.cn_bundle.crt"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: none

  coturn:
    image: "coturn/coturn:4.17.2-r0-debian@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e"
    container_name: crossdesk_coturn
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    # De image-entrypoint expandeert args via `eval echo` en sloopt zo de -n vlag; draai
    # turnserver daarom direct met een ongewijzigde command-array.
    entrypoint:
      - turnserver
    depends_on:
      crossdesk-server:
        condition: service_healthy
    volumes:
      - "${CROSSDESK_DATA_DIR:-/var/lib/crossdesk}/certs:/certs:ro"
      - "${CROSSDESK_LOG_DIR:-/var/log/crossdesk}/coturn:/var/log/coturn"
    command:
      - -n
      - "--listening-port=${COTURN_PORT:-3478}"
      - "--listening-ip=${INTERNAL_IP:?Zet INTERNAL_IP in de stackvariabelen}"
      - "--relay-ip=${INTERNAL_IP:?Zet INTERNAL_IP in de stackvariabelen}"
      - "--external-ip=${EXTERNAL_IP:?Zet EXTERNAL_IP in de stackvariabelen}/${INTERNAL_IP:?Zet INTERNAL_IP in de stackvariabelen}"
      - "--min-port=${MIN_PORT:-50000}"
      - "--max-port=${MAX_PORT:-60000}"
      - --fingerprint
      - --use-auth-secret
      - --dtls
      - "--static-auth-secret=${COTURN_AUTH_SECRET:?Zet COTURN_AUTH_SECRET in Infisical map /crossdesk}"
      - "--realm=${COTURN_REALM:-crossdesk}"
      - "--stateless-nonce-secret=${COTURN_STATELESS_NONCE_SECRET:?Zet COTURN_STATELESS_NONCE_SECRET in Infisical map /crossdesk}"
      - --cert=/certs/api.crossdesk.cn_bundle.crt
      - --pkey=/certs/api.crossdesk.cn.key
      - --log-file=/var/log/coturn/turn.log
      - --no-stdout-log
      - "--log-min-level=${COTURN_LOG_LEVEL:-warning}"
      - --new-log-timestamp
      - --cli=false
      - --no-multicast-peers
      - --proc-user=nobody
      - --proc-group=nogroup
    mem_limit: "${COTURN_MEMORY_LIMIT:-512m}"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    logging:
      driver: none
