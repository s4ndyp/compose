# tinynote — TinyNote — notities (PocketBase)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
#
# name: vast projectnaam — het volume heet tinynote_tinynote_data en dat mag niet
# verschuiven als de stack uit een andere map (Dockhand) wordt gedeployed.
name: tinynote

services:
  tinynote:
    image: ghcr.io/s4ndyp/tinynote:latest
    pull_policy: always
    container_name: tinynote
    restart: unless-stopped
    ports:
      - "${TINYNOTE_PORT:-80}:8080"
    volumes:
      - tinynote_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tinynote_data:
