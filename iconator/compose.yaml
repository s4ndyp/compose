# iconator — Iconator — icoon-generator (PocketBase)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  iconator:
    image: ghcr.io/s4ndyp/iconator:latest
    pull_policy: always
    container_name: iconator
    restart: unless-stopped
    ports:
      - "${ICONATOR_PORT:-80}:8080"
    volumes:
      - iconator_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  iconator_data:
