# wallpaparr — Wallpaparr (PocketBase + donkere web-UI)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
# De client (Windows/Unix) praat met dezelfde poort: /api/collections/wallpapers/records.
#
# name: vaste projectnaam — het volume heet wallpaparr_wallpaparr_data en dat mag niet
# verschuiven als de stack uit een andere map (Dockhand) wordt gedeployed.
name: wallpaparr

services:
  wallpaparr:
    image: ghcr.io/s4ndyp/wallpaparr:latest
    pull_policy: always
    container_name: wallpaparr
    restart: unless-stopped
    ports:
      - "${WALLPAPARR_PORT:-80}:8090"
    volumes:
      - wallpaparr_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  wallpaparr_data:
