# pocket-id — Pocket ID (OpenID Connect / OAuth2 provider met passkeys)
#
# Bron: officiële docker-compose.yml + env-referentie van github.com/pocket-id/pocket-id (v2).
# Eén Go-image met ingebouwde SQLite; alleen ENCRYPTION_KEY is verplicht, APP_URL zetten
# omdat passkeys aan een domein/adres gebonden zijn (geen localhost-gedoe).
#
# Start:  docker compose up -d   (met .env: ENCRYPTION_KEY + APP_URL)
# Via Dockhand: ENCRYPTION_KEY komt uit Infisical (map /pocket-id, env prod) via
# DOCKHAND_SECRET_SELECTOR; APP_URL als gewone stack-variabele (geen secret).
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
#
# Bewaar de ENCRYPTION_KEY offline: zonder deze sleutel zijn de opgeslagen
# token-teken-sleutels onleesbaar en is de /app/data-volume nutteloos.
# Eerste bezoeker: /setup — admin-account aanmaken voordat anderen de app zien.
# Poort: intern luistert Pocket ID op 1411 (PORT-default van v2).

services:
  pocket-id:
    image: pocketid/pocket-id:v2   # zoals officieel voorbeeld; v2 = huidige major
    pull_policy: always
    container_name: pocket-id
    restart: unless-stopped
    ports:
      # browser-UI + OIDC-endpoints: host 80, intern 1411
      - "${POCKET_ID_PORT:-80}:1411"
    environment:
      # verplicht: openssl rand -base64 32  (via Infisical-map /pocket-id)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Zet ENCRYPTION_KEY in Infisical map /pocket-id of Dockhand Environment}
      # verplicht in LAN-use: adres waarop de browser de app bereikt, bijv. http://10.5.0.162
      APP_URL: ${APP_URL:?Zet APP_URL als stack-variabele, bijv. http://<lxc-ip>}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # SQLite + gegenereerde sleutels; /app/data belongs aan PUID/PGID
      - pocketid_data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

volumes:
  pocketid_data:
