# netdata.conf — CHILD-agent op UGNAZ (Unraid).
# Netdata leest dit bovenop de ingebouwde defaults; alleen wat hier staat wijkt af.
# Wordt bij de deploy door de repo-init-container in het config-volume gezet.

[web]
    # Geen browser-toegang nodig: deze node bekijk je in het dashboard van de parent.
    bind to = 127.0.0.1:19999

[db]
    # Eigen opslag in RAM: de historie (en dus de retentie) staat bij de parent,
    # deze container hoeft alleen de laatste minuten te bufferen voor de stream.
    mode = ram

[plugin:proc:diskspace]
    # Ruimte/inodes van álle mounts worden door Netdata standaard ('auto') per mountpoint gechart,
    # op voorwaarde dat het pad binnen de container bestaat onder de host-prefix: de collector
    # stat '<prefix>/root<mountpoint>' (/host/root/mnt/user, /host/root/mnt/disk1, ...). Die
    # bind-mount staat in compose.yaml; zonder die regel zie je alleen het eigen volume.
    # Laat de defaults staan (auto) — 'yes' zou ook tmpfs-/proc-mounts van Unraid een chart geven.
