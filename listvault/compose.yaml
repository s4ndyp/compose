# listvault — ListVault — boodschappen/verzamellijst (PocketBase op poort 80)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
#
# name: vast projectnaam — het volume heet listvault_listvault_data en dat mag niet
# verschuiven als de stack uit een andere map (Dockhand) wordt gedeployed.
name: listvault

services:
  app:
    image: ghcr.io/s4ndyp/listvault:latest
    pull_policy: always
    container_name: listvault
    restart: unless-stopped
    ports:
      - "${LISTVAULT_PORT:-80}:80"
    volumes:
      - listvault_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  listvault_data:
