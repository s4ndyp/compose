# wasmme — WasmMe — WASM-site hosting (admin-UI + publieke nginx)
#
# Start:  docker compose up -d
services:
  admin:
    image: ghcr.io/s4ndyp/wasmme:latest
    pull_policy: always
    container_name: wasmme-admin
    restart: unless-stopped
    ports:
      - "${WASMME_ADMIN_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-268435456}"   # 256MB
    volumes:
      - wasmme_data:/data

  public:
    image: ghcr.io/s4ndyp/wasmme-public:latest
    pull_policy: always
    container_name: wasmme-public
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "${WASMME_PUBLIC_PORT:-80}:80"
    volumes:
      - wasmme_data:/data:ro

volumes:
  wasmme_data:
