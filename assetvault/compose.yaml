# assetvault — AssetVault — PocketBase + static UI (inventaris)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  assetvault:
    image: ghcr.io/s4ndyp/assetvault:latest
    pull_policy: always
    container_name: assetvault
    restart: unless-stopped
    ports:
      - "${ASSETVAULT_PORT:-80}:8090"
    volumes:
      - assetvault_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  assetvault_data:
