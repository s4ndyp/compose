# fileshare — FileShare — Node.js-bestandsdeling
#
# Geen publieke image; bouwt rechtstreeks vanaf GitHub (BuildKit git-context).

# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  fileshare:
    build:
      context: https://github.com/s4ndyp/fileshare.git#main
    image: fileshare:latest
    container_name: fileshare
    restart: unless-stopped
    ports:
      - "${FILESHARE_PORT:-80}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-536870912}"   # bytes, default 512MB
    volumes:
      - fileshare_data:/data

volumes:
  fileshare_data:
