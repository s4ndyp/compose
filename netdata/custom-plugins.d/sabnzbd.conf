# sabnzbd.conf — instellingen voor de SABnzbd-collector (sabnzbd.plugin).
#
# LET OP: hier staat BEWUST geen api_key. Die komt uit de omgevingsvariabele
# SABNZBD_APIKEY, die Dockhand bij elke deploy uit Infisical (map /netdata,
# via DOCKHAND_SECRET_SELECTOR) injecteert. Een sleutel in git = verbrand.
#
# url          : waar de SABnzbd-web-API luistert (CT123, eigen poort 7777 — niet 8080)
# update_every : hoe vaak (seconden) de collector SABnzbd bevraagt; minimaal 5
url = http://10.5.0.123:7777
update_every = 5
