# netdata — Netdata (self-hosted PARENT / metrics-centralisatiepunt met eigen dashboards)
#
# Bron: netdata/netdata — officiële Docker-installatiegids en de parent/child-referentie
# (https://learn.netdata.cloud/docs/netdata-parents/parent-child-configuration-reference).
# Er is geen apart "parent-image": een parent is een gewone agent met een stream.conf
# die inkomende streams accepteert. Deze stack doet precies dat.
#
# Poort: web-dashboard, API én de metrics-streaming delen dezelfde poort — container-intern 19999.
# Published: host 80 (${NETDATA_PORT:-80}, de browser-route) én host 19999 (de netdata-standaardpoort
# waarop child-agents streamen). Zonder die tweede mapping bestaat er op het LXC-IP geen 19999 en
# moeten child-hosts naar :80 streamen — dat werkt, maar 19999 is de intuitieve/gedocumenteerde
# netdata-poort. Beide mappen naar container-19999; streaming is geen browser-dienst.
#
# Config: /etc/netdata is een named volume; de eenmalige container 'netdata-repo-init'
# vult het met netdata.conf + stream.conf. Bestands-binds werken niet op een externe
# Dockhand-daemon (de daemon kent de repo-checkout niet → docker maakt er een lege map
# van; zie skill lxc-app-deploy). De API-sleutel staat NIET in git: de template
# netdata/stream.conf bevat de placeholder @NETDATA_STREAM_API_KEY@, die de
# init-container bij deploy vervangt door de waarde van de stack-variabele
# NETDATA_STREAM_API_KEY (uit Infisical map /netdata via DOCKHAND_SECRET_SELECTOR).
#
# Child (agent) toevoegen op een andere host — in /etc/netdata/stream.conf van die host:
#   [stream]
#       enabled = yes
#       destination = 10.5.0.<parent-vmid>:19999
#       api key = <dezelfde sleutel>
# Daarna verschijnt die host vanzelf als node in het dashboard van deze parent.
#
# LET OP — alles lokaal, geen Netdata Cloud:
# `http://<lxc-ip>/` toont sinds Netdata v2 een onboarding-splash ("Welcome to Netdata /
# Please sign-in to continue"). De knop **Sign-in** stuurt je naar app.netdata.cloud —
# niet aanklikken. Het LOKALE dashboard zit op **/v3/** (daar levert de agent dezelfde SPA
# met `isLocal: true` en laadt de dashboard-UI direct, geen sign-in). Gebruik dus
# http://<lxc-ip>/v3/ of https://netdata.xdio.nl/v3/; op de splash is er ook een link
# "Skip and use the dashboard anonymously" — dat laadt het lokale dashboard eveneens.
# Er wordt niets naar de cloud gestuurd: geen claim-token (/var/lib/netdata/cloud.d is leeg,
# dus ACLK blijft uit) en DISABLE_TELEMETRY/DO_NOT_TRACK staan aan.
# NB: de nieuwe dashboard-UI heeft géén eigen login — de passkey-gate op het domein
# (Zoraxy + Pocket ID) is wat de browser-toegang afschermt.
#
# Upgrade: image-tag ophogen (Docker Hub netdata/netdata, bv. v2.13.x) en redeployen.
name: netdata

services:
  # Eenmalige initialisatie van het config-volume (idempotent: bestaande bestanden
  # worden overschreven, netdata zelf doet daarna 'cp -an' en raakt ze niet aan).
  netdata-repo-init:
    container_name: netdata-repo-init
    image: alpine:3.22
    entrypoint:
      - sh
      - -c
      - |
        set -e
        BASE=https://raw.githubusercontent.com/s4ndyp/compose/main/netdata
        wget -q -O /etc/netdata/netdata.conf "$$BASE/netdata.conf"
        wget -q -O /tmp/stream.conf.tpl      "$$BASE/stream.conf"
        sed "s|@NETDATA_STREAM_API_KEY@|$$NETDATA_STREAM_API_KEY|" /tmp/stream.conf.tpl > /etc/netdata/stream.conf
        rm -f /tmp/stream.conf.tpl
        grep -q . /etc/netdata/netdata.conf /etc/netdata/stream.conf
        echo "netdata config-initialisatie klaar"
    restart: "no"
    environment:
      # API-sleutel voor inkomende streams; uit Infisical (map /netdata) of Dockhand Stack-Environment.
      NETDATA_STREAM_API_KEY: ${NETDATA_STREAM_API_KEY:?Zet NETDATA_STREAM_API_KEY in Infisical map /netdata (of Dockhand Stack-Environment)}
    volumes:
      - netdata_config:/etc/netdata

  netdata:
    container_name: netdata
    image: netdata/netdata:v2.12.3
    hostname: netdata-parent
    restart: unless-stopped
    # eigen PID-namespace delen met de LXC: zonder dit ziet de collector alleen zichzelf
    pid: host
    cap_add:
      - SYS_PTRACE
    ports:
      # browser-route (dashboard + API): host 80 → container 19999
      - "${NETDATA_PORT:-80}:19999"
      # streaming-endpoint voor child-agents: de netdata-standaardpoort 19999 op het LXC-IP.
      # Geen browser-dienst, dus een eigen host-poort naast de vaste 80 (één 80-mapping per stack).
      - "19999:19999"
    environment:
      # geen Netdata Cloud-claim, geen anonieme telemetrie
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      # config (netdata.conf + stream.conf) — gevuld door netdata-repo-init
      - netdata_config:/etc/netdata
      # database (metrics-historie van deze parent én van alle child-nodes)
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      # host-metrics van de LXC zelf (de prefix /host is de 'host access prefix')
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      # container-metrics van deze LXC
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      netdata-repo-init:
        condition: service_completed_successfully

volumes:
  netdata_config:
  netdata_lib:
  netdata_cache:
