# stream.conf — deze Netdata werkt als PARENT: hij accepteert inkomende metrics-streams
# van child-agents. Dit bestand wordt bij de deploy door de container 'netdata-repo-init'
# in het config-volume (/etc/netdata) gezet.
#
# De API-sleutel staat NIET in git: de placeholder @NETDATA_STREAM_API_KEY@ in de
# sectiekop hieronder wordt bij de deploy vervangen door de waarde van de stack-variabele
# NETDATA_STREAM_API_KEY (Infisical map /netdata). Dezelfde sleutel gebruik je op elke
# child-agent.
#
# Child (agent) toevoegen — op die host in /etc/netdata/stream.conf:
#   [stream]
#       enabled = yes
#       destination = 10.5.0.<parent-vmid>:19999
#       api key = <dezelfde sleutel>
# (Bij een Docker-child: dezelfde regels in het config-volume van die container.)
#
# Meerdere sleutels (bijv. één per child) mogen: voeg hier extra blokken toe met een eigen
# uuid als sectiekop, maar dan moet de sleutel ook in de repo-template/Infisical passen —
# voor één gedeelde sleutel is dit ene blok genoeg.

[@NETDATA_STREAM_API_KEY@]
    # dit blok = 'API key'-sectie uit de Netdata-documentatie; de kop IS de sleutel
    type = api
    enabled = yes
    # welke child-hosts mogen streamen met deze sleutel (LAN-breed; per sleutel te beperken)
    allow from = *
    # opslag: in de dbengine-tiers van deze parent (met eigen retentie, zie netdata.conf)
    db = dbengine
    # alerts van child-nodes meenemen en die de eerste minuut na verbinden onderdrukken
    health enabled = auto
    postpone alerts on connect = 1m
    # child blijft in het dashboard staan (niet als vluchtige node opruimen)
    is ephemeral node = no
