# netdata.conf — instellingen voor deze Netdata-parent (opslag/retentie + bereikbaarheid).
# Netdata leest dit bovenop de ingebouwde defaults: alles wat hier niet staat houdt de
# standaardwaarde. De volledig effectieve config is op te vragen op
# http://<parent>:19999/netdata.conf (en te controleren na een wijziging hier).

[db]
    # Opslag: recente data in RAM, oudere op schijf (dbengine met drie tiers).
    # Tiers houden dezelfde data op grofweg 1 seconde / 1 minuut / 1 uur.
    # Ruimte per tier is een zachte grens; deze LXC heeft een schijf van 20 GB.
    dbengine tier 0 retention size = 2GiB
    dbengine tier 0 retention time = 30d
    dbengine tier 1 retention size = 1GiB
    dbengine tier 1 retention time = 6mo
    dbengine tier 2 retention size = 1GiB
    dbengine tier 2 retention time = 2y
    # RAM-cache van de database (LXC heeft 4096 MB; de rest is voor de collector).
    dbengine page cache size = 256MiB

[web]
    # Dashboard én de metrics-streaming van child-nodes komen beide binnen op 19999;
    # de ACL hieronder geldt dus voor allebei (streaming authenticeert met de API-sleutel
    # uit stream.conf). Zonder '*' kunnen child-hosts buíten deze host niet streamen.
    bind to = *:19999
    allow connections from = *
    allow dashboard from = *
