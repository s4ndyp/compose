# webtool — WebTool — web-appbouwer (Node + PocketBase in één)
#
# Start:  docker compose up -d
# Gebruiker opent de app in de browser op poort 80 van de eigen LXC/host.
services:
  webtool:
    image: ghcr.io/s4ndyp/webtool:latest
    pull_policy: always
    container_name: webtool
    restart: unless-stopped
    ports:
      - "${WEBTOOL_PORT:-80}:3000"
    environment:
      PORT: "3000"
      POCKETBASE_URL: "http://127.0.0.1:8090"
      PB_DATA_DIR: /data/pb
    volumes:
      - webtool_data:/data

volumes:
  webtool_data:
