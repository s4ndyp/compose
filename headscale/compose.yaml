# Headscale + Headplane — externe (niet-s4ndyp) stack.
#
# Headscale = self-hosted Tailscale-controlserver (WireGuard-mesh zonder Tailscale-account).
# Headplane = web-UI/beheerpaneel voor die headscale.
#
# Draait op een eigen LXC (Dockhand-env 'headscale', daemon http://10.5.0.<vmid>:2375).
# Poorten:  headplane (web-UI)      host 80  -> 3000   (UI op pad /admin)
#           headscale (control+API) host 8080 -> 8080  (Tailscale-clients + API; kan geen 80 zijn)
# Domeinen: headplane.xdio.nl -> <lxc>:80   (beheer-UI)
#           headscale.xdio.nl -> <lxc>:8080 (server_url voor de clients, via Zoraxy HTTPS)
#
# Secrets staan NIET in dit bestand. De stackvariabelen COOKIE_SECRET, HEADSCALE_API_KEY,
# OIDC_CLIENT_ID en OIDC_CLIENT_SECRET komen uit Dockhand (Stack -> Environment; zie Infisical
# map /headscale) en de repo-init-container rendert ze in de config-bestanden.
# Zonder OIDC-variabelen start de stack ook (OIDC uit) — de tweede deploy zet SSO aan.
name: headscale

services:
  # Eenmalige init-container: haalt de config-templates uit deze repo en schrijft de
  # gerenderde configs (met secrets uit de omgeving) in de twee config-volumes.
  # Idempotent; draait opnieuw bij elke deploy waarin de stackvariabelen wijzigen.
  repo-init:
    image: alpine:3.20
    container_name: headscale-repo-init
    restart: "no"
    # Eén regel (geen multiline `command: |`: dat wordt door de deploy-laag per regel
    # als los argv-item doorgegeven). De repo-tarball komt van codeload (dynamisch, geen
    # CDN-cache zoals raw.githubusercontent.com) en render.sh doet de rest.
    entrypoint: ["/bin/sh", "-c", "wget -qO /tmp/r.tgz https://codeload.github.com/s4ndyp/compose/tar.gz/refs/heads/main && mkdir -p /tmp/compose-src && tar -xzf /tmp/r.tgz -C /tmp/compose-src && exec sh /tmp/compose-src/*/headscale/render.sh"]
    environment:
      BASE_URL: ${BASE_URL:-https://headplane.xdio.nl}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - headscale-config:/hs
      - headplane-config:/hp

  headscale:
    image: headscale/headscale:0.29.7
    container_name: headscale
    restart: unless-stopped
    command: serve
    labels:
      # Dit label laat headplane zijn headscale-container vinden (docker-integratie).
      me.tale.headplane.target: headscale
    depends_on:
      repo-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - headscale-data:/var/lib/headscale
      - headscale-config:/etc/headscale
    healthcheck:
      # De headscale-image is ko/distroless (Cmd /ko-app/headscale): geen shell, geen wget.
      test: ["CMD", "/ko-app/headscale", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  headplane:
    image: ghcr.io/tale/headplane:0.8.2
    container_name: headplane
    restart: unless-stopped
    depends_on:
      repo-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-80}:3000"
    volumes:
      - headplane-config:/etc/headplane:ro
      - headplane-data:/var/lib/headplane
      # Lees-/schrijfrecht op de headscale-config: de UI beheert DNS/ACL en herstart headscale.
      - headscale-config:/etc/headscale
      # Alleen-lezen toegang tot de docker-socket: headplane herstart headscale na
      # een configwijziging vanuit de UI (image draait als root, dus geen group_add nodig).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/bin/hp_healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  headscale-data:
  headscale-config:
  headplane-data:
  headplane-config:
