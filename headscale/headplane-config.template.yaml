# Headplane-config TEMPLATE. De repo-init-container rendert dit naar
# /etc/headplane/config.yaml in het volume headplane-config; de placeholders komen
# uit Dockhand-stackvariabelen (COOKIE_SECRET, HEADSCALE_API_KEY, OIDC_*).
#
# cookie_secure staat aan: de UI is alleen via https (Zoraxy/domein) te gebruiken.

server:
  host: "0.0.0.0"
  port: 3000
  base_path: "/admin"
  base_url: "__BASE_URL__"
  cookie_secret: "__COOKIE_SECRET__"
  cookie_secure: true
  cookie_max_age: 86400
  data_path: "/var/lib/headplane"

headscale:
  url: "http://headscale:8080"
  public_url: "https://headscale.xdio.nl"
  config_path: "/etc/headscale/config.yaml"
  api_key: "__API_KEY__"

integration:
  # Agent uit: die zou in de headplane-container een tailscale-client opzetten.
  agent:
    enabled: false
  # Docker-integratie: headplane leest de containerstatus en herstart headscale
  # wanneer je in de UI netwerk-/DNS-instellingen wijzigt.
  docker:
    enabled: true
    container_label: "me.tale.headplane.target=headscale"
    socket: "unix:///var/run/docker.sock"
  kubernetes:
    enabled: false
    # Verplicht veld in het schema, ook als de integratie uit staat.
    pod_name: ""
  proc:
    enabled: false

oidc:
  enabled: __OIDC_ENABLED__
  issuer: "https://pocket.xdio.nl"
  client_id: "__OIDC_CLIENT_ID__"
  client_secret: "__OIDC_CLIENT_SECRET__"
  token_endpoint_auth_method: "client_secret_post"
  use_pkce: true
