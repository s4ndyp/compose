# Headscale-config TEMPLATE. De repo-init-container rendert dit bestand naar
# /etc/headscale/config.yaml in het volume headscale-config; de placeholders
# __OIDC_CLIENT_ID__ / __OIDC_CLIENT_SECRET__ komen uit Dockhand-stackvariabelen.
# Het OIDC-blok tussen '# >>>OIDC' en '# <<<OIDC' wordt weggelaten zolang er geen
# client-id is gezet.
#
# Let op: headplane kan deze config ook aanpassen (netwerk-instellingen in de UI);
# een nieuwe deploy overschrijft dat weer met deze template.

server_url: https://headscale.xdio.nl
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

# X-Forwarded-For / X-Real-IP van de proxy's vertrouwen (Zoraxy + LAN + docker-bridge).
trusted_proxies:
  - 10.1.2.250/32
  - 10.5.0.0/16
  - 172.16.0.0/12

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

derp:
  # Geen embedded DERP: de host is LAN-only, dus STUN/UDP naar buiten kan niet.
  # Clients gebruiken de publieke Tailscale-DERP-map als relay.
  server:
    enabled: false
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: ""
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/acl.hujson

dns:
  magic_dns: true
  base_domain: proxlan.nl
  override_local_dns: true
  nameservers:
    global:
      - 10.5.0.110
      - 10.5.0.111
      - 1.1.1.1
    split: {}
  search_domains: []
  extra_records: []
  # Headplane beheert de extra DNS-records via dit bestand (headscale kijkt er live naar).
  extra_records_path: /etc/headscale/extra_records.json

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: true

auto_update:
  enabled: false

# >>>OIDC
oidc:
  # Niet blokkeren op de IdP bij het starten: SSO is een login-route, niet een startvoorwaarde.
  only_start_if_oidc_is_available: false
  issuer: "https://pocket.xdio.nl"
  client_id: "__OIDC_CLIENT_ID__"
  client_secret: "__OIDC_CLIENT_SECRET__"
  scope: ["openid", "profile", "email"]
  email_verified_required: false
  pkce:
    enabled: true
    method: S256
  expiry: 180d
# <<<OIDC
